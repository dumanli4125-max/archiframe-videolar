<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../kit/engine.js"></script>
<script>
// 06 — Dışarıda güler yüz, evde surat. Satır başlangıçları audio.py VO ile AYNI.
const DURATION = 57.5;
const AM=C.amber, CO=C.coral, TE=C.teal, CR=C.cream;
const T=(tr,en)=>L(tr,en); // İngilizce kelime zamanlarına göre küçük kaydırmalar

// ---------- yardımcılar ----------
// ağız: k=1 gülümseme, 0 düz, -1 surat
function mouth(fig,f,s,k){const h=fig.head,x=h[0]+18*f*s,y=h[1]+15*s;ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=5*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-12*s,y-3*s*k);ctx.quadraticCurveTo(x,y+13*s*k,x+12*s,y-3*s*k);ctx.stroke();ctx.restore();}
// gülen gözler (^ ^): figure()'ın gözlerinin üstüne boyar
function happyEyes(fig,f,s,col){const h=fig.head,ey=h[1]-4*s;ctx.save();
  for(const dx of [10,27]){const ex=h[0]+dx*f*s;ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,8.5*s,0,7);ctx.fill();
    ctx.strokeStyle=C.ink;ctx.lineWidth=5*s;ctx.lineCap='round';ctx.beginPath();ctx.arc(ex,ey+4*s,7*s,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}
  ctx.restore();}
function heart(x,y,r,col,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;glow(col,18);ctx.beginPath();
  ctx.moveTo(x,y+r*0.9);ctx.bezierCurveTo(x-r*1.6,y-r*0.2,x-r*0.7,y-r*1.4,x,y-r*0.45);ctx.bezierCurveTo(x+r*0.7,y-r*1.4,x+r*1.6,y-r*0.2,x,y+r*0.9);ctx.fill();ctx.restore();}
// "+1" ve kalp efekti
function pop(x,y,t0,t){const u=(t-t0)/1.4;if(u<0||u>1)return;const a=Math.min(1,u*6)*(1-sm(0.6,1,u));const dy=-u*120;
  ctx.save();ctx.globalAlpha=a;ctx.font='800 58px Inter';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=AM;glow(AM,24);
  ctx.fillText('+1',x,y+dy);ctx.restore();heart(x+70,y+dy+4,20,CO,a);heart(x-62,y+dy+30-u*30,13,CO,a*0.8);}
// sayaç paneli
function counter(x,y,label,val,{color=AM,pulse=0,alpha=1,scale=1}={}){if(alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(scale,scale);
  rr(-150,-70,300,140,22);ctx.fillStyle='#0a1426';glow('rgba(0,0,0,.6)',24);ctx.fill();noGlow();ctx.lineWidth=3;ctx.strokeStyle=hexA(color,0.4+pulse*0.6);ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 24px Inter';ctx.letterSpacing='5px';ctx.fillStyle=hexA(color,0.85);ctx.fillText(label,2.5,-38);
  ctx.letterSpacing='0px';ctx.font='800 72px "DejaVu Sans Mono"';glow(color,18+pulse*30);ctx.fillStyle=color;ctx.fillText(String(val),0,18);
  ctx.restore();}
const WAVE=(t,ph=0)=>({ua:150,fa:178+26*Math.sin(t*13+ph)});
// karakter + etiket kısayolu
function person(o,label,labelCol,la=1){const p=figure(o);if(label)tag(label,p.head[0],p.head[1]-(o.s||1)*92,labelCol,la*(o.alpha??1));return p;}
function walker(x,p,f,s=1,extra={}){return {x,y:standY(s)-walkBob(p),s,facing:f,...walk(p),...extra};}
function streetLamp(x,a=1){ctx.strokeStyle='#2c4772';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x,1400);ctx.lineTo(x,860);ctx.stroke();
  ctx.fillStyle='#2c4772';ctx.fillRect(x-36,850,72,14);lampCone(x,864,380,536,a);ctx.save();ctx.fillStyle=AM;glow(AM,30);ctx.fillRect(x-26,862,52,6);ctx.restore();}
function shopCounter(x,w){ctx.fillStyle='#1d3254';rr(x,1210,w,190,10);ctx.fill();ctx.fillStyle='#24406b';rr(x-10,1196,w+20,22,8);ctx.fill();}
function bag(x,y){ctx.save();ctx.fillStyle='#d9cdb4';rr(x-24,y,48,58,8);ctx.fill();ctx.strokeStyle='#d9cdb4';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,14,Math.PI,0);ctx.stroke();
  ctx.fillStyle=TE;ctx.fillRect(x-10,y-10,8,16);ctx.fillStyle=AM;ctx.beginPath();ctx.arc(x+8,y-4,9,0,7);ctx.fill();ctx.restore();}
function plate(x,y,steam=1,t=0){ctx.save();ctx.fillStyle='#f6efe0';glow('rgba(255,181,71,.5)',14);ctx.beginPath();ctx.ellipse(x,y,44,12,0,0,7);ctx.fill();noGlow();
  ctx.fillStyle=AM;ctx.beginPath();ctx.ellipse(x,y-6,26,9,0,Math.PI,0);ctx.fill();
  if(steam>0){ctx.strokeStyle=hexA(CR,0.45*steam);ctx.lineWidth=3;for(let i=-1;i<=1;i++){ctx.beginPath();for(let k=0;k<=12;k++){const yy=y-16-k*5;const xx=x+i*14+Math.sin(k*0.7+t*4+i)*5;k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}}
  ctx.restore();}
function wallClock(x,y,r,mins){ctx.save();ctx.fillStyle='#0a1426';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=hexA(AM,0.6);glow(AM,14);ctx.stroke();noGlow();
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.strokeStyle=hexA(CR,0.6);ctx.lineWidth=i%3?2:4;ctx.beginPath();ctx.moveTo(x+Math.sin(a)*r*0.78,y-Math.cos(a)*r*0.78);ctx.lineTo(x+Math.sin(a)*r*0.9,y-Math.cos(a)*r*0.9);ctx.stroke();}
  const ha=(mins/60%12)/12*Math.PI*2, ma=(mins%60)/60*Math.PI*2, sa=((window.__t||0)%60)/60*Math.PI*2*12;
  ctx.lineCap='round';ctx.strokeStyle=CR;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(ha)*r*0.48,y-Math.cos(ha)*r*0.48);ctx.stroke();
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(ma)*r*0.7,y-Math.cos(ma)*r*0.7);ctx.stroke();
  ctx.strokeStyle=CO;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(sa)*r*0.75,y-Math.cos(sa)*r*0.75);ctx.stroke();
  ctx.fillStyle=AM;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.restore();}
function chairR(x){ctx.fillStyle='#22385c';ctx.fillRect(x,1328,120,14);ctx.fillRect(x+55,1342,10,58);rr(x+116,1180,22,160,10);ctx.fill();} // ters sandalye, kalça (x+60,1322)

// sayaç değeri (gün boyu)
function smileCount(t){if(t<6.8)return 0;if(t<10.9)return 1;if(t<13.1)return 2;if(t<15.7)return 3;if(t<17.5)return 4;
  return Math.min(20,4+Math.floor(16*clamp((t-17.5)/1.15)));}
const POPS=[6.8,10.9,13.1,15.7];

// ================= SAHNELER =================
// 0) Kanca: kalabalık sokak
function sHook(t){
  room();windowNight(90,560,900,520,{moon:false,city:true});streetLamp(150,0.8);streetLamp(930,0.8);
  const dim=sm(2.2,2.9,t);
  // gelip geçen krem kalabalık
  [[-1,0],[1,1.7],[-1,3.1],[1,0.9]].forEach(([dir,ph],i)=>{const sp=170+i*30;let x=dir>0?-120+((t+ph)*sp)%1320:1200-((t+ph)*sp)%1320;
    const p=figure({...walker(x,(t+ph)*8,dir,0.8),color:CR,alpha:0.55*(1-dim*0.6)});if(dim<0.5)mouth(p,dir,0.8,0.7);});
  const happy=1-dim;
  const p=figure({x:540,y:STAND_Y,color:CO,...POSE.stand,...(happy>0.5?WAVE(t):{}),lean:3});
  if(happy>0.5){happyEyes(p,1,1,CO);mouth(p,1,1,1);}else mouth(p,1,1,-0.7);
  tag('SEN',p.head[0],p.head[1]-92,CO);
  pop(640,900,0.6,t);pop(420,860,1.4,t);
  fade(dim*0.45,'5,10,20');
  caption(L([[['Dışarıda ','#fff'],['herkese',AM]],[['gülüyorsun.','#fff']]],[[['You smile at','#fff']],[['everyone',AM],[' out there.','#fff']]]),0.2,T(2.35,2.55),t,L(84,76),210);
  caption(L([[['Peki ','#fff'],['evde?',CO]]],[[['But ','#fff'],['at home?',CO]]]),T(2.3,2.5),3.5,t,96,240);
}
// 1) Ofis: patron
function sOffice(t){
  room();windowNight(90,560,900,520,{moon:false,city:true});ceilingLamp(540,0.8,1130);tag('OFİS',540,520,AM,0.9);
  desk(620,330);monitor(700,1110,1);
  const joke=t>4.6&&t<6.6, laugh=t>6.6;
  const g=joke?{ua:110+20*Math.sin(t*9),fa:150+25*Math.sin(t*9+1),ua2:60,fa2:120}:{};
  const pt=person({x:300,y:STAND_Y,color:CR,s:1.08,...POSE.stand,...g,lean:laugh?8+3*Math.sin(t*16):3,facing:1,nodY:laugh?2*Math.sin(t*16):0},'PATRON',CR);
  if(joke||laugh){happyEyes(pt,1,1.08,CR);mouth(pt,1,1.08,1);}
  bubble(430,868,L('Bilgisayar niye üşür? Windows açık!','Why is the PC cold? Windows open!'),sm(4.7,5.0,t)*(1-sm(6.6,6.9,t)));
  // SEN
  const k=sm(6.5,6.9,t);
  const base={x:760,y:STAND_Y,color:CO,...POSE.stand,facing:-1,lean:3};
  const sp=figure(k>0.5?{...base,...WAVE(t),lean:-2+2*Math.sin(t*14)}:{...base,ua:20+4*Math.sin(t*2),fa:40});
  if(k>0.5){happyEyes(sp,-1,1,CO);mouth(sp,-1,1,1);}else mouth(sp,-1,1,0.2);
  tag('SEN',sp.head[0],sp.head[1]-92,CO);
  if(laugh){ctx.save();ctx.globalAlpha=sm(6.6,6.8,t)*(1-sm(7.4,7.7,t));ctx.font='800 40px Inter';ctx.fillStyle=CR;ctx.textAlign='center';ctx.fillText('ha ha ha',300,880-(t-6.6)*30);ctx.restore();}
}
// 2) Tezgâh: müşteri
function sShop(t){
  room();ceilingLamp(780,0.7,930);tag(L('İŞ YERİ','WORK'),540,520,AM,0.9);
  // raflar
  ctx.fillStyle='#16294a';for(let i=0;i<3;i++){ctx.fillRect(600,640+i*150,400,12);for(let j=0;j<6;j++){ctx.fillStyle=[TE,AM,CR][(i+j)%3];ctx.globalAlpha=0.35;ctx.fillRect(615+j*64,590+i*150,40,50);ctx.globalAlpha=1;ctx.fillStyle='#16294a';}}
  const sp=figure({x:790,y:STAND_Y,color:CO,...POSE.stand,facing:-1,ua:35+3*Math.sin(t*3),fa:80,ua2:30,fa2:85,lean:2+(t>10.8?2*Math.sin(t*12):0)});
  const smiling=t>10.8;
  if(smiling){happyEyes(sp,-1,1,CO);mouth(sp,-1,1,1);}else mouth(sp,-1,1,0.35);
  shopCounter(600,390);
  tag('SEN',sp.head[0],sp.head[1]-92,CO);
  const yell=t>8.2&&t<10.6, sh=yell?Math.sin(t*40)*4:0;
  const mp=person({x:330+sh,y:STAND_Y,color:CR,...POSE.stand,facing:1,ua:yell?150+25*Math.sin(t*11):40,fa:yell?190+20*Math.sin(t*13):60,ua2:yell?120+25*Math.sin(t*11+2):20,fa2:yell?160:40,lean:yell?12:5,eyes:'wide'},'MÜŞTERİ',CR);
  mouth(mp,1,1,yell?-1:-0.4);
  bubble(380,900,L('Bu ne biçim hizmet?!','What kind of service is this?!'),sm(8.3,8.55,t)*(1-sm(10.4,10.7,t)),'#c0392b');
}
// 3a) Market kasası
function sMarket(t){
  room();ceilingLamp(700,0.8,930);tag('MARKET',540,520,TE,0.9);
  ctx.fillStyle='#16294a';for(let i=0;i<3;i++){ctx.fillRect(80,640+i*150,360,12);for(let j=0;j<5;j++){ctx.fillStyle=[AM,TE,CO][(i+j)%3];ctx.globalAlpha=0.3;ctx.fillRect(95+j*68,590+i*150,44,50);ctx.globalAlpha=1;ctx.fillStyle='#16294a';}}
  const kp=person({x:800,y:STAND_Y,color:CR,...POSE.stand,facing:-1,ua:60+12*Math.sin(t*5),fa:95,ua2:50,fa2:90},'KASİYER',CR,sm(12,12.4,t));
  if(t>13.2){happyEyes(kp,-1,1,CR);mouth(kp,-1,1,0.8);}else mouth(kp,-1,1,0);
  shopCounter(620,340);ctx.save();rr(650,1120,110,76,8);ctx.fillStyle='#0b1426';ctx.fill();glow(TE,20);ctx.fillStyle=hexA(TE,0.5);ctx.fillRect(662,1132,86,30);ctx.restore();
  const arrive=sm(11.9,12.9,t), pw=t*8.5;
  const sp=figure(arrive<1?walker(lerp(150,470,arrive),pw,1,1,{ua2:15,fa2:20,color:CO}):{x:470,y:STAND_Y,color:CO,...POSE.stand,facing:1,ua2:15,fa2:20});
  bag(sp.handB[0],sp.handB[1]);
  if(t>12.9){happyEyes(sp,1,1,CO);mouth(sp,1,1,1);}else mouth(sp,1,1,0.4);
  tag('SEN',sp.head[0],sp.head[1]-92,CO);
}
// 3b) Apartman girişi
function sLobby(t){
  room();tag(L('APARTMAN','BUILDING'),540,520,AM,0.9);
  // bina kapısı
  ctx.fillStyle='#0d1a33';rr(380,860,320,540,14);ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=8;rr(380,860,320,540,14);ctx.stroke();
  ctx.save();glow(AM,30);ctx.fillStyle=hexA(AM,0.35);rr(400,880,280,200,8);ctx.fill();ctx.restore();ctx.fillStyle=C.line;ctx.fillRect(536,880,8,520);
  ceilingLamp(540,0.6,560);
  // görevli süpürüyor
  const sw=Math.sin(t*5);
  const gp=person({x:790,y:STAND_Y,color:CR,...POSE.stand,facing:-1,ua:40+14*sw,fa:70+10*sw,ua2:46+14*sw,fa2:80,lean:10,nodY:3},L('GÖREVLİ','DOORMAN'),CR,sm(14.7,15.1,t));
  ctx.strokeStyle='#8c6a3c';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(gp.hand[0],gp.hand[1]-40);ctx.lineTo(gp.hand[0]-60-sw*20,1385);ctx.stroke();
  ctx.fillStyle='#8c6a3c';ctx.fillRect(gp.hand[0]-95-sw*20,1378,70,14);
  if(t>15.7){happyEyes(gp,-1,1,CR);mouth(gp,-1,1,0.7);}else mouth(gp,-1,1,0);
  const u=clamp((t-14.6)/1.1),pw=t*8.5;
  const sp=figure(u<1?walker(lerp(120,420,u),pw,1,1,{color:CO}):{x:420,y:STAND_Y,color:CO,...POSE.stand,facing:1,...(t>15.6?WAVE(t):{})});
  if(t>15.6){happyEyes(sp,1,1,CO);mouth(sp,1,1,1);}else mouth(sp,1,1,0.4);
  tag('SEN',sp.head[0],sp.head[1]-92,CO);
}
// 4) Montaj: 20 gülümseme
function sMontage(t){
  room();windowNight(90,560,900,520,{moon:false,city:true});
  // hayalet yüzler (dışarıdakiler)
  ['PATRON','MÜŞTERİ','KASİYER','GÖREVLİ'].forEach((n,i)=>{const x=[170,400,680,910][i];const a=0.4*sm(17.2+i*0.2,17.6+i*0.2,t);
    const p=figure({x,y:standY(0.7),s:0.7,color:CR,...POSE.stand,facing:i<2?1:-1,alpha:a});mouth(p,i<2?1:-1,0.7,0.8);});
  const p=figure({x:540,y:STAND_Y,color:CO,...POSE.stand,...WAVE(t),lean:2*Math.sin(t*6)});happyEyes(p,1,1,CO);mouth(p,1,1,1);
  tag('SEN',p.head[0],p.head[1]-92,CO);
  for(let i=0;i<16;i++){const t0=17.5+i*0.072;pop(200+((i*271)%700),1150-((i*137)%420),t0,t);}
}
// 5) Akşam sokak, eve yürüyüş
function sStreet(t){
  room();windowNight(90,560,900,520,{moon:true,city:true});streetLamp(300,0.7);streetLamp(820,0.7);
  const u=clamp((t-20.7)/1.8),pw=t*6.5;
  const sp=figure(walker(lerp(200,980,u),pw,1,1,{color:CO,eyes:'tired',nodY:6,lean:8}));mouth(sp,1,1,-0.2);
  tag('SEN',sp.head[0],sp.head[1]-92,CO);
}
// 6) EV
function sHome(t){
  room();
  windowNight(620,560,320,360,{moon:true});
  wallClock(380,700,66,20*60+42+(t-22.4)*0.5);
  plant(1035);
  // SEN'in oda kapısı (sol)
  const close=sm(34.45,34.75,t);
  ctx.save();ctx.fillStyle='#050a14';ctx.fillRect(30,1030,140,370);
  ctx.fillStyle='#1b3156';const pw=lerp(34,140,close);ctx.fillRect(30,1030,pw,370);
  ctx.fillStyle=AM;ctx.beginPath();ctx.arc(30+pw-16,1225,6,0,7);ctx.fill();
  if(close>=1){ctx.fillStyle=hexA(AM,0.7);glow(AM,20);ctx.fillRect(34,1394,132,5);}
  ctx.restore();ctx.strokeStyle=C.line;ctx.lineWidth=6;ctx.strokeRect(30,1030,140,370);
  tag(L('ODAN','ROOM'),100,990,CR,0.55*sm(30.8,31.3,t)*(1-sm(32.2,32.6,t)));
  // ön kapı ışığı (sağ kenar)
  const fd=sm(22.4,22.8,t)*(1-sm(24.2,24.8,t));
  if(fd>0){const g=ctx.createLinearGradient(1080,0,860,0);g.addColorStop(0,hexA(AM,0.45*fd));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(860,1000,220,400);}
  // kanepe + lamba
  floorLamp(1000,0.6);
  sofa(220,300);
  // masa + kardeş
  desk(620,240);chairR(870);
  const platePut=sm(38.6,39.1,t);
  if(t>39.1) plate(700,1254,1-sm(46,52,t),t);
  // kardeş: ödev yazar; kapı çarpınca durur, kapıya bakar
  const slam=t>34.75;
  const kw=t<34.75?Math.sin(t*22)*6:0;
  const kwave=t>27.6&&t<29.4;
  const kd=person({x:930,y:1322,s:0.78,color:CR,...POSE.sitType,facing:-1,fa:95+kw,fa2:93-kw,...(kwave?{ua:150,fa:175+25*Math.sin(t*13)}:{}),
    lean:slam?2:9,eyes:slam&&t<38?'wide':'open',look:slam?-2:4,nodY:t>40?4:0},L('KARDEŞ','BROTHER'),CR,sm(25.2,25.7,t));
  mouth(kd,-1,0.78,kwave?0.8:(slam?-0.4:0));
  ctx.fillStyle='#e9e2cf';ctx.fillRect(838,1258,46,8); // defter
  // ANNE
  let ap; const AS=1.0;
  if(t<26.9){ap={x:300,y:1300,...POSE.sit,ua:24+4*Math.sin(t*1.5),fa:64,facing:1,look:0};}
  else if(t<36.3){const k=sm(26.9,27.6,t);ap=blend({x:300,y:1300,...POSE.sit},{x:330,y:STAND_Y,...POSE.stand,ua:70,fa:95,ua2:10,fa2:20},k);ap.facing=1;
    ap.nodY=t>31.5?lerp(0,6,sm(31.5,33,t)):0;}
  else if(t<38.6){const u=sm(36.3,38.5,t),p=(t-36.3)*6.5;ap={x:lerp(330,560,u),y:STAND_Y-walkBob(p),...walk(p,18),ua:70,fa:95,facing:1,nodY:5};}
  else {const k=sm(38.6,39.1,t);ap={x:560,y:STAND_Y,...POSE.stand,ua:lerp(70,62,k),fa:lerp(95,118,k),ua2:10,fa2:20,facing:1,nodY:5};
    if(t>39.4){const s2=sm(39.4,40.4,t);ap={...ap,...blend(ap,POSE.sad,s2)};ap.x=560;ap.y=STAND_Y;ap.facing=1;}
    if(t>45.2){ap.facing=-1;ap.look=-2;}}
  const ap2=person({...ap,color:CR,s:AS,eyes:t>31.6&&t<46?'tired':(ap.eyes||'open')},'ANNE',CR,sm(24.0,24.5,t)*(1-sm(29.0,29.4,t)*(1-sm(33.6,34.2,t))));
  const speaking=L((t>27.3&&t<28.3)||(t>28.8&&t<29.9),(t>27.7&&t<28.5)||(t>29.0&&t<30.4));
  mouth(ap2,ap.facing,AS,t<31.6?(speaking?0.9+0.3*Math.sin(t*30):0.8):(t<46?-0.5:-0.3));
  if(t>26.9&&t<39.1){const hx=ap2.hand[0]+(ap.facing||1)*14,hy=ap2.hand[1]-6;
    const px=t<38.6?hx:lerp(hx,700,platePut),py=t<38.6?hy:lerp(hy,1254,platePut);plate(px,py,1,t);}
  bubble(290,895,L('Hoş geldin!','Welcome home!'),sm(T(27.3,27.7),T(27.55,27.95),t)*(1-sm(T(28.6,29.0),T(28.85,29.25),t)));
