<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../kit/engine.js"></script>
<script>
// 15 — Balık mı, olta mı? Satır başlangıçları (audio.py VO ile AYNI):
// l01 0.3 | l02 4.3 | l03 9.6 | l04 14.6 | l05 19.7 | l06 25.9 | l07 29.5 | l08 34.8 | l09 39.9 | l10 45.8 | l11 52.5 | l12 56.6
const DURATION = 64.9;
const AM=C.amber, CO=C.coral, TE=C.teal, CRM=C.cream, WH='#fff';
const HZ=1120, PEND=880, FX=330, BKX=520;
const HOLD=[735,1392];           // olta sehpası (iskele ucu)
const WP=[1012,1500];            // şamandıranın suya düştüğü yer
const cap=(tr,en,t0,t1,t,size=70)=>caption(L(tr,en),t0,t1,t,size);
const pulseAt=(t,a,d=0.5)=>t>a?1-sm(a,a+d,t):0;

// ---------------- MEKÂN: sahil, deniz, fener, iskele ----------------
function sky(t,warm=0){
  const g=ctx.createLinearGradient(0,0,0,HZ);g.addColorStop(0,'#0b1730');g.addColorStop(0.7,'#16244a');
  g.addColorStop(1,warm>0?`rgb(${Math.round(lerp(44,90,warm))},${Math.round(lerp(40,52,warm))},${Math.round(lerp(80,70,warm))})`:'#2c2a55');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HZ);
  for(let i=0;i<40;i++){const x=(i*173)%W,y=60+((i*97)%(HZ-520));const tw=0.35+0.35*Math.sin(t*2+i);ctx.fillStyle=`rgba(255,255,255,${tw*0.55})`;ctx.fillRect(x,y,3,3);}
  // ay
  ctx.save();ctx.fillStyle='#e9e2cf';glow('#e9e2cf',50);ctx.beginPath();ctx.arc(190,600,44,0,7);ctx.fill();ctx.restore();
}
function sea(t){
  const g=ctx.createLinearGradient(0,HZ,0,H);g.addColorStop(0,'#14305a');g.addColorStop(1,'#060f20');
  ctx.fillStyle=g;ctx.fillRect(0,HZ,W,H-HZ);
  ctx.strokeStyle=hexA(C.line,0.9);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,HZ);ctx.lineTo(W,HZ);ctx.stroke();
  // dalga çizgileri
  for(let k=1;k<16;k++){const y=HZ+Math.pow(k/16,1.5)*(H-HZ);const sp=(k*37+t*(14+k*3))%160;
    ctx.strokeStyle=hexA('#7fa6d6',0.06+0.1*(k/16));ctx.lineWidth=1.5+k*0.18;
    for(let x=-160+sp;x<W;x+=160){const wv=Math.sin(t*1.3+k+x*0.01)*3;ctx.beginPath();ctx.moveTo(x,y+wv);ctx.lineTo(x+40+k*3,y+wv);ctx.stroke();}}
  // ay yansıması
  for(let i=0;i<14;i++){const y=HZ+14+i*22;const w=50-i*2+Math.sin(t*3+i)*12;ctx.fillStyle=hexA(CRM,0.22-i*0.012);ctx.fillRect(190-w/2+Math.sin(t*2+i*1.7)*8,y,w,3);}
}
function lighthouse(t){
  const x=960;
  // kayalar
  ctx.fillStyle='#0a1426';[[0,1150,90,40],[-70,1160,70,30],[70,1162,60,26]].forEach(([dx,y,rx,ry])=>{ctx.beginPath();ctx.ellipse(x+dx,y,rx,ry,0,Math.PI,0);ctx.fill();});
  // gövde
  ctx.save();ctx.beginPath();ctx.moveTo(x-46,1150);ctx.lineTo(x+46,1150);ctx.lineTo(x+28,700);ctx.lineTo(x-28,700);ctx.closePath();ctx.fillStyle='#1d3254';ctx.fill();ctx.clip();
  ctx.fillStyle=hexA(CRM,0.5);for(let y=730;y<1150;y+=110)ctx.fillRect(x-60,y,120,48);ctx.restore();
  // lamba odası
  ctx.fillStyle='#22385c';ctx.fillRect(x-40,696,80,10);
  ctx.save();glow(AM,50);ctx.fillStyle=AM;rr(x-22,650,44,46,6);ctx.fill();ctx.restore();
  ctx.fillStyle='#22385c';ctx.beginPath();ctx.moveTo(x-34,652);ctx.lineTo(x+34,652);ctx.lineTo(x,612);ctx.closePath();ctx.fill();
  // dönen ışık
  const d=Math.cos(t*1.05);const len=1150*Math.abs(d)+60;
  ctx.save();ctx.globalAlpha=0.07+0.16*Math.abs(d);const gx=x+d*len;
  const g=ctx.createLinearGradient(x,672,gx,672);g.addColorStop(0,hexA(AM,0.9));g.addColorStop(1,hexA(AM,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,666);ctx.lineTo(gx,620);ctx.lineTo(gx,740);ctx.lineTo(x,680);ctx.closePath();ctx.fill();ctx.restore();
}
function pier(){
  ctx.fillStyle='#1c1a2c';[40,200,360,520,680,840].forEach(x=>{ctx.fillRect(x-9,1430,18,190);});
  ctx.strokeStyle=hexA('#7fa6d6',0.18);ctx.lineWidth=2;[40,200,360,520,680,840].forEach(x=>{ctx.beginPath();ctx.ellipse(x,1620,26,6,0,0,7);ctx.stroke();});
  ctx.fillStyle='#2b2a3f';ctx.fillRect(-20,1400,PEND+20,34);
  ctx.fillStyle='#4a4560';ctx.fillRect(-20,1400,PEND+20,5);
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;for(let x=30;x<PEND;x+=62){ctx.beginPath();ctx.moveTo(x,1405);ctx.lineTo(x,1434);ctx.stroke();}
  // bağlama babası
  ctx.fillStyle='#22385c';rr(PEND-40,1370,26,32,6);ctx.fill();
}
function fire(t,a=1){
  const x=FX;
  // ışık
  ctx.save();const r=ctx.createRadialGradient(x,1380,10,x,1380,330);r.addColorStop(0,hexA(AM,0.26*a));r.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=r;ctx.fillRect(x-340,1040,680,420);ctx.restore();
  // kütükler
  ctx.strokeStyle='#4a3428';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-46,1398);ctx.lineTo(x+40,1380);ctx.moveTo(x+46,1398);ctx.lineTo(x-40,1380);ctx.stroke();
  // alev
  ctx.save();glow(AM,30);
  for(let i=0;i<3;i++){const h=(64-i*14)*(0.85+0.15*Math.sin(t*13+i*2));const w=26-i*6;const ox=Math.sin(t*9+i)*4;
    ctx.fillStyle=i===0?CO:(i===1?AM:'#ffe3a8');ctx.beginPath();ctx.moveTo(x-w+ox,1386);ctx.quadraticCurveTo(x-w*0.6+ox,1386-h*0.6,x+ox*2,1386-h);ctx.quadraticCurveTo(x+w*0.6+ox,1386-h*0.6,x+w+ox,1386);ctx.closePath();ctx.fill();}
  ctx.restore();
  // sacayak + tencere
  ctx.strokeStyle='#2c4772';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-62,1400);ctx.lineTo(x,1238);ctx.lineTo(x+62,1400);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,1238);ctx.lineTo(x,1268);ctx.stroke();
  ctx.fillStyle='#3a5582';rr(x-38,1272,76,48,12);ctx.fill();ctx.fillStyle='#4b6a9c';rr(x-44,1266,88,12,6);ctx.fill();
  ctx.strokeStyle='#3a5582';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,1268,30,Math.PI,0);ctx.stroke();
  // buhar
  for(let i=0;i<3;i++){const u=((t*0.5+i/3)%1);ctx.strokeStyle=hexA(CRM,0.25*(1-u));ctx.lineWidth=4;ctx.beginPath();
    const yy=1250-u*120;ctx.moveTo(x-12+i*12,yy);ctx.quadraticCurveTo(x+Math.sin(t*2+i)*18,yy-20,x-6+i*12,yy-40);ctx.stroke();}
}
function bucket(t,{lid=0,fishes=3}={}){
  const x=BKX;ctx.fillStyle='#4f6f96';ctx.beginPath();ctx.moveTo(x-36,1336);ctx.lineTo(x+36,1336);ctx.lineTo(x+28,1400);ctx.lineTo(x-28,1400);ctx.closePath();ctx.fill();
  ctx.fillStyle='#6a8bb2';ctx.fillRect(x-38,1332,76,8);
  ctx.strokeStyle='#8fa8c8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,1336,30,Math.PI,0);ctx.stroke();
  if(lid<1){for(let i=0;i<fishes;i++){const fx=x-18+i*18;ctx.save();ctx.translate(fx,1330-(lid*20));ctx.rotate(-0.3+i*0.3);ctx.fillStyle='#9fd0d8';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-9,-18);ctx.lineTo(9,-18);ctx.closePath();ctx.fill();ctx.restore();}}
  if(lid>0){const ly=lerp(1240,1326,lid);const lx=lerp(x+90,x,lid);ctx.fillStyle='#8fa8c8';rr(lx-42,ly,84,12,6);ctx.fill();ctx.fillRect(lx-8,ly-8,16,10);}
}
function crate(x,top,w=100){ctx.fillStyle='#3b3248';rr(x-w/2,top,w,1400-top,6);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x-w/2+6,top+(1400-top)/2);ctx.lineTo(x+w/2-6,top+(1400-top)/2);ctx.stroke();}
function beach(t,{warm=0}={}){sky(t,warm);sea(t);lighthouse(t);pier();}

// ---------------- NESNELER ----------------
function fish(x,y,s=1,rot=0,{a=1,col='#9fd0d8',cook=0,eaten=0}={}){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  const c=cook>0?`rgb(${Math.round(lerp(159,214,cook))},${Math.round(lerp(208,140,cook))},${Math.round(lerp(216,80,cook))})`:col;
  if(eaten<1){ctx.save();ctx.beginPath();ctx.rect(-60+eaten*90,-40,140,80);ctx.clip();
    ctx.fillStyle=c;glow(hexA(c,0.7),14);ctx.beginPath();ctx.ellipse(0,0,36,15,0,0,7);ctx.fill();noGlow();
    ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-56,-16);ctx.lineTo(-56,16);ctx.closePath();ctx.fill();ctx.restore();}
  if(eaten>0){ctx.strokeStyle=hexA(CRM,0.85);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(30,0);ctx.stroke();
    for(let i=-20;i<=20;i+=10){ctx.beginPath();ctx.moveTo(i,-10);ctx.lineTo(i,10);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-48,-12);ctx.moveTo(-30,0);ctx.lineTo(-48,12);ctx.stroke();}
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(22,-4,3.5,0,7);ctx.fill();ctx.restore();}
function bones(x,y,rot=0){fish(x,y,0.6,rot,{eaten:1});}
// olta: taban (bx,by), açı ang (rad, -: yukarı), uzunluk len, bend 0..1 (balık çekerken bükülür). Uç noktayı döndürür.
function rod(bx,by,ang,len=330,bend=0){
  const tx=bx+Math.cos(ang)*len,ty=by+Math.sin(ang)*len;
  const mx=(bx+tx)/2-Math.sin(ang)*-bend*50,my=(by+ty)/2+Math.cos(ang)*bend*70;
  const tip=[lerp(tx,mx+ (tx-bx)*0.35,bend*0.3),lerp(ty,ty+bend*90,1)];
  ctx.strokeStyle='#c9a46a';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(mx,my,tip[0],tip[1]);ctx.stroke();
  ctx.fillStyle='#2c4772';ctx.beginPath();ctx.arc(bx+Math.cos(ang)*40,by+Math.sin(ang)*40,9,0,7);ctx.fill();
  return tip;}
function line(tip,end,taut=0,{bob=true}={}){
  ctx.strokeStyle=hexA(CRM,0.7);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...tip);
  ctx.quadraticCurveTo((tip[0]+end[0])/2+20,Math.max(tip[1],end[1])+(1-taut)*40-(1-taut)*0,end[0],end[1]);ctx.stroke();
  if(bob){ctx.fillStyle=WH;ctx.beginPath();ctx.arc(end[0],end[1]-5,7,Math.PI,0);ctx.fill();ctx.fillStyle=CO;ctx.beginPath();ctx.arc(end[0],end[1]-1,7,0,Math.PI);ctx.fill();}}
function ripple(x,y,t,t0){if(t<t0||t>t0+1.4)return;for(let i=0;i<3;i++){const u=clamp((t-t0-i*0.18)/1.0);if(u<=0)continue;ctx.strokeStyle=hexA(CRM,0.6*(1-u));ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,10+u*70,3+u*14,0,0,7);ctx.stroke();}}
function splash(x,y,t,t0){if(t<t0||t>t0+0.8)return;const u=(t-t0)/0.8;for(let i=0;i<7;i++){const an=-Math.PI*(0.15+0.7*i/6);const r=20+u*70;ctx.fillStyle=hexA('#cfe6ff',0.8*(1-u));ctx.beginPath();ctx.arc(x+Math.cos(an)*r,y+Math.sin(an)*r+u*u*60,5,0,7);ctx.fill();}}
// fırlatma: u 0..1 → oltanın ucundan suya yay
function castArc(tip,u){return [lerp(tip[0],WP[0],u),lerp(tip[1],WP[1],u)-Math.sin(u*Math.PI)*220];}
function hat(h,f=1,s=1){ctx.save();ctx.fillStyle='#8a6f4e';ctx.beginPath();ctx.ellipse(h[0],h[1]-26*s,60*s,11*s,0,0,7);ctx.fill();
  rr(h[0]-33*s,h[1]-64*s,66*s,40*s,14*s);ctx.fill();ctx.fillStyle='#5e4a33';ctx.fillRect(h[0]-33*s,h[1]-36*s,66*s,8*s);ctx.restore();}
function dayPanel(text,a=1,pulse=0,y=470){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font='800 50px Inter';ctx.letterSpacing='3px';
  const w=ctx.measureText(text).width+80;rr(540-w/2,y-58,w,116,18);ctx.fillStyle='#0a1426';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=hexA(AM,0.4+0.5*pulse);ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';glow(AM,18+pulse*26);ctx.fillStyle=AM;ctx.fillText(text,542,y+2);ctx.restore();}
function meter(x,y,k,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;rr(x-70,y-9,140,18,9);ctx.fillStyle='#0a1426';ctx.fill();ctx.strokeStyle=hexA(AM,0.7);ctx.lineWidth=2;ctx.stroke();
  rr(x-66,y-5,132*clamp(k),10,5);ctx.fillStyle=k<0.4?CO:AM;glow(ctx.fillStyle,10);ctx.fill();ctx.restore();}
function laughText(x,y,a,t){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font='800 42px Inter';ctx.fillStyle=AM;ctx.textAlign='center';glow(AM,16);ctx.fillText(L('ha ha!','haha!'),x,y-Math.sin(t*7)*6);ctx.restore();}

// ---------------- KARAKTERLER ----------------
// SEN: iskelenin başında izliyor
function sen(t,{think=0,cheer=0}={}){let o=blend({...POSE.stand},{...POSE.think},think);o=blend(o,{...POSE.stand,ua:150,fa:170},cheer);
  const s=0.95;const p=figure({x:115,y:standY(s)-(cheer>0.3?Math.abs(Math.sin(t*9))*10*cheer:0),color:CO,s,...o,facing:1});tag('SEN',p.head[0],p.head[1]-86,CO);return p;}
// balıkçı: oturuyor. turn=0 denize (sağa), 1 gence (sola) dönük. arm: {ua,fa} ön kol
function fisher(t,{x=640,turn=0,arm=null,armB=null,tagA=0,eyes='open',clap=0}={}){
  const f=turn>0.5?-1:1;let o={...POSE.sit,lean:6};
  if(arm)o={...o,...arm};if(armB)o={...o,...armB};
  if(clap>0){const c=Math.abs(Math.sin(t*12));o=blend(o,{ua:70,fa:120+c*30,ua2:70,fa2:110+c*30},clap);}
  crate(x,1328);
  const p=figure({x,y:1322,color:CRM,s:1,...o,facing:f,eyes});hat(p.head,f,1);
  if(tagA>0)tag(L('BALIKÇI','FISHERMAN'),p.head[0],p.head[1]-112,CRM,tagA);return p;}
// genç: dr = omuz düşüklüğü 0..1
function youngStand(x,dr,{s=null,f=1,walkP=null,o2=null,k=0,tagA=0,eyes=null,y=null}={}){
  s=s??(0.9-0.1*dr);let o={...POSE.stand,lean:3+18*dr,nodY:14*dr,ua:6+4*dr,fa:10,ua2:6,fa2:10};
  let yy=y??standY(s);
  if(walkP!==null){o={...walk(walkP,24-8*dr),lean:4+16*dr,nodY:14*dr};yy=standY(s)-walkBob(walkP)*s;}
  if(o2)o=blend(o,o2,k);
  const p=figure({x,y:yy,color:CRM,s,...o,facing:f,eyes:eyes??(dr>0.55?'tired':'open'),look:dr*6});
  if(tagA>0)tag(L('GENÇ','YOUNG GUY'),p.head[0],p.head[1]-88*s-8,CRM,tagA);return p;}
const CROUCH={lean:22,th:105,sh:-15,th2:100,sh2:-20,ua:60,fa:80,ua2:50,fa2:70};
function youngCrouch(x,dr,{f=-1,o2=null,k=0,tagA=0,s=null}={}){s=s??(0.9-0.1*dr);let o={...CROUCH,lean:22+12*dr,nodY:14*dr};if(o2)o=blend(o,o2,k);
  const p=figure({x,y:1400-49*s,color:CRM,s,...o,facing:f,eyes:dr>0.55?'tired':'open'});if(tagA>0)tag(L('GENÇ','YOUNG GUY'),p.head[0],p.head[1]-88*s-8,CRM,tagA);return p;}

// ---------------- SAHNE 0: KANCA (0 – 4.3) ----------------
function sHook(t){
  beach(t);fire(t);bucket(t);
  youngCrouch(425,0.3,{f:1,o2:{ua:30,fa:40,ua2:20,fa2:30,lean:8},k:1});
  // balıkçı ayakta: bir elinde balık, bir elinde olta
  const lift=sm(0.3,1.2,t);
  const o=blend({...POSE.stand},{...POSE.stand,ua:120,fa:150,ua2:-125,fa2:-150},lift);
  const p=figure({x:700,y:STAND_Y,color:CRM,s:1,...o,facing:-1});hat(p.head,-1,1);
  const fB=pulseAt(t,2.2,1.2)*0.6+(t>2.2?0.4:0), rB=pulseAt(t,3.5,1.0)*0.6+(t>3.5?0.4:0);
  ctx.save();if(t>3.5){ctx.globalAlpha=0.55+0.45*(1-sm(3.5,4.0,t)*0.4);}ctx.restore();
  fish(p.hand[0]-6,p.hand[1]-14,1.05+0.15*pulseAt(t,2.2,0.6),-0.4);
  const tip=rod(p.handB[0],p.handB[1]+10,-1.25,300,0);line(tip,[tip[0]+20,tip[1]+150],0,{bob:true});
  if(t>2.1)tag(L('BALIK','FISH'),p.hand[0]-10,p.hand[1]-90,TE,sm(2.1,2.4,t));
  if(t>3.4)tag(L('OLTA','ROD'),tip[0]-10,tip[1]-50,AM,sm(3.4,3.7,t));
  sen(t);
  cap([[['Birine yardım ederken...',WH]]],[[['When you help someone...',WH]]],0.2,1.95,t,70);
  cap([[['ona ',WH],['balık',TE],[' mı veriyorsun,',WH]],[['olta',AM],[' mı?',WH]]],[[['do you hand them a ',WH],['fish,',TE]],[['or a ',WH],['rod?',AM]]],1.95,4.2,t,68);
}

// ---------------- SAHNE 1: HER AKŞAM (4.3 – 29.4) ----------------
const DAYS1=[[4.3,'PAZARTESİ','MONDAY'],[17.78,'SALI','TUESDAY'],[20.45,'ÇARŞAMBA','WEDNESDAY'],[21.29,'PERŞEMBE','THURSDAY'],[22.41,'CUMA','FRIDAY'],
  [23.72,'CUMARTESİ','SATURDAY'],[26.0,'PAZAR','SUNDAY'],[27.58,'PAZARTESİ','MONDAY'],[28.42,'SALI','TUESDAY']];
const GIVES=[[20.45,0],[21.29,0],[22.41,0]];       // hızlı günler: balık ver
function dr1(t){return t<19.7?0:(t<25.6?lerp(0,0.55,sm(19.7,25.6,t)):lerp(0.55,1,sm(25.9,29.0,t)));}
function sFirst(t){
  // arka plan + kılçık + kova + panel
  beach(t);fire(t);
  let nb=0;const BT=[17.2,20.9,21.75,22.9,26.8,27.9,28.7];BT.forEach(b=>{if(t>b)nb++;});
  for(let i=0;i<nb;i++)bones(200+i*22-(i%2)*8,1395-(i%2)*5,(i%3-1)*0.3);
  bucket(t);
  let di=0;DAYS1.forEach((d,i)=>{if(t>=d[0])di=i;});const dd=DAYS1[di];
  dayPanel(L(dd[1],dd[2]),sm(4.4,4.8,t),pulseAt(t,dd[0],0.5));
  const wait=sm(23.75,25.3,t);
  const clockA=sm(5.0,5.4,t)*(1-sm(9.6,10.0,t))+sm(23.6,23.9,t)*(1-sm(25.6,25.9,t));
  if(clockA>0)clockPanel(540,620,fmt(19*60+(t>23.5&&t<26?wait*45:0)),pulseAt(t,5.23,0.6)+(t>23.6&&t<25.6?0.4:0),clockA*0.95);
  if(t>6.0&&t<9.6)tag(L('İSKELE','PIER'),300,1470,AM,sm(6.08,6.4,t)*(1-sm(9.2,9.6,t)));

  // ----- balıkçının dönüşü / balık verme -----
  // tek balık verme olayları: [dön başla, balık elde, uzat, teslim, geri dön]
  const EV=[[11.84,12.78,13.71,14.15,14.6],[20.25,20.45,20.6,20.8,21.0],[21.1,21.29,21.45,21.65,21.85],[22.2,22.41,22.6,22.8,23.05],[24.95,25.15,25.3,25.5,25.75]];
  let turn=0,reach=0,dip=0,hasFish=false,give=0;
  for(const e of EV){const [a,b,c,d,z]=e;
    const tr=sm(a,a+0.25,t)*(1-sm(z,z+0.25,t));turn=Math.max(turn,tr);
