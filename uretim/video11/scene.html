<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../kit/engine.js"></script>
<script>
// 11 — Sabah telaşında sarılmak. Satır başlangıçları audio.py VO ile AYNI.
// l01 0.3 · l02 4.8 · l03 9.9 · l04 13.9 · l05 20.8 · l06 25.3 · l07 29.1 · l08 32.4 · l09 36.0 · l10 40.3 · l11 45.0 · l12 50.6
const DURATION = 59.0;
const AM=C.amber, CO=C.coral, TE=C.teal, CR=C.cream;
const SEV=L('SEVGİLİ','PARTNER');
const T=(tr,en)=>L(tr,en); // yalnız İngilizcede olay kaydırma
// EN: l11 kelimeleri TR'den geç düşüyor; sBath2'yi 45 sn sonrası için zaman-eğriyle oynat (TR'de birebir)
const W2=[[45.0,45.0],[46.3,45.8],[48.33,47.0],[49.26,48.35],[49.9,49.15],[60,59.25]];
const warp2=t=>LANG==='en'&&t>45?keyed(t,W2):t;

// ---------- yardımcılar ----------
let REF=0; // 1 = aynadaki yansıma çiziliyor (etiket/balon yok, soluk)
function mouth(fig,f,s,k){const h=fig.head,x=h[0]+18*f*s,y=h[1]+15*s;ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=5*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-12*s,y-3*s*k);ctx.quadraticCurveTo(x,y+13*s*k,x+12*s,y-3*s*k);ctx.stroke();ctx.restore();}
function happyEyes(fig,f,s,col){const h=fig.head,ey=h[1]-4*s;ctx.save();
  for(const dx of [10,27]){const ex=h[0]+dx*f*s;ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,8.5*s,0,7);ctx.fill();
    ctx.strokeStyle=C.ink;ctx.lineWidth=5*s;ctx.lineCap='round';ctx.beginPath();ctx.arc(ex,ey+4*s,7*s,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}
  ctx.restore();}
function heart(x,y,r,col,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=col;glow(col,18);ctx.beginPath();
  ctx.moveTo(x,y+r*0.9);ctx.bezierCurveTo(x-r*1.6,y-r*0.2,x-r*0.7,y-r*1.4,x,y-r*0.45);ctx.bezierCurveTo(x+r*0.7,y-r*1.4,x+r*1.6,y-r*0.2,x,y+r*0.9);ctx.fill();ctx.restore();}
function heartLine(x,y,r,col,a=1,dash=true){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=5;if(dash)ctx.setLineDash([14,12]);glow(col,14);ctx.beginPath();
  ctx.moveTo(x,y+r*0.9);ctx.bezierCurveTo(x-r*1.6,y-r*0.2,x-r*0.7,y-r*1.4,x,y-r*0.45);ctx.bezierCurveTo(x+r*0.7,y-r*1.4,x+r*1.6,y-r*0.2,x,y+r*0.9);ctx.stroke();ctx.restore();}
// karakter (yansımada soluk, etiketsiz)
function person(o,label,labelCol,lx=0){const p=figure({...o,alpha:(o.alpha??1)*(REF?0.3:1),glow:REF?false:o.glow});
  if(label&&!REF)tag(label,p.head[0]+lx,p.head[1]-(o.s||1)*92,labelCol,o.alpha??1);return p;}
function say(x,y,text,a,color){if(!REF)bubble(x,y,text,a,color);}
function walker(x,p,f,s=1,extra={}){return {x,y:standY(s)-walkBob(p),s,facing:f,...walk(p),...extra};}
// diş fırçası (el -> ağız yönünde)
function brush(hx,hy,f,col,foam=0){ctx.save();ctx.lineCap='round';ctx.strokeStyle=col;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(hx-f*6,hy+8);ctx.lineTo(hx+f*30,hy-8);ctx.stroke();
  ctx.fillStyle='#f6efe0';ctx.fillRect(hx+f*26-4,hy-16,10,8);
  if(foam>0){ctx.globalAlpha*=foam;ctx.fillStyle='#f6efe0';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(hx+f*(34+((i*7)%10)),hy-12+((i*5)%9),4+(i%2)*2,0,7);ctx.fill();}}
  ctx.restore();}
function phoneOf(p,f,lit,t,extra={}){phone(p.hand[0]+f*6,p.hand[1]-16,{lit,rot:-0.35*f,t,...extra});}
function cup(x,y,n){ctx.save();if(n>0){ctx.lineCap='round';ctx.lineWidth=7;[[CO,-8,-0.18],[TE,8,0.18]].slice(0,n).forEach(([c,dx,r])=>{ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(x+dx,y-10);ctx.lineTo(x+dx+r*90,y-84);ctx.stroke();
  ctx.fillStyle='#f6efe0';ctx.beginPath();ctx.arc(x+dx+r*92,y-88,6,0,7);ctx.fill();});}
  rr(x-24,y-46,48,48,8);ctx.fillStyle='#2f6b62';ctx.fill();ctx.restore();}
function tiles(){ctx.save();ctx.strokeStyle=hexA(TE,0.07);ctx.lineWidth=2;for(let x=0;x<=W;x+=90){ctx.beginPath();ctx.moveTo(x,560);ctx.lineTo(x,FLOOR);ctx.stroke();}
  for(let y=560;y<=FLOOR;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.restore();}
const MIR={x:320,y:640,w:440,h:400};
function mirror(lit){ctx.save();rr(MIR.x,MIR.y,MIR.w,MIR.h,22);const g=ctx.createLinearGradient(MIR.x,MIR.y,MIR.x+MIR.w,MIR.y+MIR.h);g.addColorStop(0,'#1a3355');g.addColorStop(1,'#0e1f38');ctx.fillStyle=g;ctx.fill();
  ctx.globalAlpha=0.08+0.08*lit;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(MIR.x+60,MIR.y);ctx.lineTo(MIR.x+140,MIR.y);ctx.lineTo(MIR.x+40,MIR.y+MIR.h);ctx.lineTo(MIR.x-40,MIR.y+MIR.h);ctx.closePath();ctx.fill();ctx.restore();}
function mirrorFrame(pulse=0){ctx.save();ctx.lineWidth=8;ctx.strokeStyle=pulse>0?hexA(AM,0.4+0.6*pulse):'#2c4772';if(pulse>0)glow(AM,30*pulse);rr(MIR.x,MIR.y,MIR.w,MIR.h,22);ctx.stroke();ctx.restore();}
function mirrorLamp(a){ctx.save();ctx.fillStyle='#22385c';rr(400,596,280,22,10);ctx.fill();if(a>0){ctx.globalAlpha=a;glow(AM,40);ctx.fillStyle=AM;rr(410,604,260,8,4);ctx.fill();}ctx.restore();noGlow();if(a>0)lampCone(540,618,760,780,a*0.75);}
function counter(sinkPulse=0){ctx.fillStyle='#1b3156';ctx.fillRect(260,1186,560,214);ctx.strokeStyle=hexA(C.line,0.9);ctx.lineWidth=3;ctx.strokeRect(300,1220,220,150);ctx.strokeRect(560,1220,220,150);
  ctx.fillStyle='#24406b';rr(240,1160,600,28,10);ctx.fill();
  ctx.save();ctx.fillStyle='#0a1426';ctx.beginPath();ctx.ellipse(540,1166,70,9,0,0,7);ctx.fill();
  ctx.strokeStyle=sinkPulse>0?hexA(AM,0.5+0.5*sinkPulse):'#8aa0c0';if(sinkPulse>0)glow(AM,24*sinkPulse);ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(540,1160);ctx.lineTo(540,1112);ctx.quadraticCurveTo(540,1096,560,1100);ctx.lineTo(572,1104);ctx.stroke();ctx.restore();}
function bathRoom(lit){room();tiles();mirror(lit);mirrorLamp(lit);}
// yansıma: oyuncuları aynada küçük, ters ve soluk çiz
function reflect(drawActors,t){ctx.save();rr(MIR.x,MIR.y,MIR.w,MIR.h,22);ctx.clip();ctx.translate(540,1120);ctx.scale(-0.62,0.62);ctx.translate(-540,-STAND_Y);REF=1;drawActors(t);REF=0;ctx.restore();}
// kısa ikon "pop" (ayakkabı, anahtar)
function popIcon(kind,x,y,t0,t){const u=(t-t0)/1.3;if(u<0||u>1)return;const a=Math.min(1,u*6)*(1-sm(0.65,1,u));ctx.save();ctx.globalAlpha=a;ctx.translate(x,y-u*70);
  ctx.fillStyle='rgba(16,30,54,.92)';ctx.strokeStyle=hexA(AM,0.8);ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,54,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=AM;ctx.strokeStyle=AM;glow(AM,16);
  if(kind==='shoe'){ctx.beginPath();ctx.moveTo(-30,-14);ctx.lineTo(-6,-14);ctx.quadraticCurveTo(0,4,30,6);ctx.quadraticCurveTo(36,16,28,20);ctx.lineTo(-30,20);ctx.closePath();ctx.fill();}
  else{ctx.lineWidth=7;ctx.beginPath();ctx.arc(-14,-6,14,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(30,18);ctx.moveTo(18,11);ctx.lineTo(12,22);ctx.moveTo(26,16);ctx.lineTo(21,26);ctx.stroke();}
  ctx.restore();}
function msgCard(x,y,from,msg,a){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y+(1-a)*20);
  rr(-330,-70,660,140,28);ctx.fillStyle='rgba(16,30,54,0.96)';glow('rgba(0,0,0,.6)',30);ctx.fill();noGlow();ctx.lineWidth=2;ctx.strokeStyle=hexA(TE,0.6);ctx.stroke();
  ctx.fillStyle=CR;ctx.beginPath();ctx.arc(-262,0,36,0,7);ctx.fill();ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(-252,-4,4,0,7);ctx.arc(-238,-4,4,0,7);ctx.fill();
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='800 26px Inter';ctx.letterSpacing='3px';ctx.fillStyle=TE;ctx.fillText(from,-205,-24);
  ctx.letterSpacing='0px';ctx.font='600 38px Inter';ctx.fillStyle='#e9eef7';ctx.fillText(msg,-205,20);
  ctx.font='500 24px Inter';ctx.fillStyle='rgba(233,238,247,.45)';ctx.textAlign='right';ctx.fillText('23:48',305,-24);ctx.restore();}
// sebep kartları
function reasonCard(x,y,kind,label,a,stamp){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y-(1-a)*80);
  card(0,0,290,330,{stroke:AM});
  ctx.translate(0,-40);ctx.fillStyle=AM;ctx.strokeStyle=AM;glow(AM,16);
  if(kind==='cake'){ctx.fillStyle=CR;rr(-62,-10,124,70,10);ctx.fill();ctx.fillStyle=CO;ctx.fillRect(-62,14,124,10);ctx.fillStyle=TE;ctx.fillRect(-4,-44,8,34);ctx.fillStyle=AM;ctx.beginPath();ctx.ellipse(0,-54,8,13,0,0,7);ctx.fill();}
  else if(kind==='gift'){ctx.fillStyle=TE;rr(-60,-24,120,90,8);ctx.fill();ctx.fillStyle=AM;ctx.fillRect(-9,-24,18,90);ctx.fillRect(-66,-34,132,22);ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(-20,-46,20,12,-0.4,0,7);ctx.ellipse(20,-46,20,12,0.4,0,7);ctx.stroke();}
  else{ctx.strokeStyle='#2f6b62';ctx.lineWidth=6;for(const r of [-0.35,0,0.35]){ctx.beginPath();ctx.moveTo(0,60);ctx.lineTo(Math.sin(r)*70,-20);ctx.stroke();}
    [[-24,-28,CO],[0,-36,AM],[24,-28,CO]].forEach(([fx,fy,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(fx,fy,18,0,7);ctx.fill();});}
  noGlow();ctx.translate(0,40);
  ctx.font='800 34px Inter';ctx.textAlign='center';ctx.textBaseline='middle';ctx.letterSpacing='2px';ctx.fillStyle=CR;ctx.fillText(label,0,112);
  if(stamp>0){ctx.save();ctx.globalAlpha=a*stamp;ctx.rotate(-0.22);const s=1+0.6*(1-stamp);ctx.scale(s,s);ctx.strokeStyle=CO;ctx.lineWidth=6;rr(-110,-38,220,76,12);ctx.stroke();
    ctx.font='800 40px Inter';ctx.letterSpacing='5px';ctx.fillStyle=CO;ctx.fillText(L('SEBEP','REASON'),3,2);ctx.restore();}
  ctx.restore();}

// ================= SAHNELER =================
// Banyo 1 (0 – 13.85): loş kanca, ışık yanar, 07:12, ikisi de fırça + telefon
function actors1(t){
  const bs=t>10.4, bp=t>11.5;
  const sw=Math.sin(t*16), sw2=Math.sin(t*15+1.3);
  const sp=person({x:400,y:STAND_Y,color:CO,...POSE.stand,facing:-1,ua:28,fa:140,ua2:bs?36+5*sw:10,fa2:bs?165:16,look:4,nodY:3},'SEN',CO);
  if(bs)brush(sp.handB[0],sp.handB[1],-1,CO,sm(10.6,11.2,t));
  mouth(sp,-1,1,-0.15);
  phoneOf(sp,-1,t>13.0,t);
  const pp=person({x:690,y:STAND_Y,color:CR,...POSE.stand,facing:1,ua:28,fa:140,ua2:bp?36+5*sw2:10,fa2:bp?165:16,look:4,nodY:3},SEV,CR);
  if(bp)brush(pp.handB[0],pp.handB[1],1,TE,sm(11.7,12.3,t));
  mouth(pp,1,1,-0.15);
  phoneOf(pp,1,t>13.0,t);
}
function sBath1(t){
  const lit=0.18+0.82*sm(4.85,5.25,t);
  bathRoom(lit);
  reflect(actors1,t);mirrorFrame();
  counter();cup(290,1160,0);
  actors1(t);
  // kanca: aralarında kesik çizgili kalp + ?
  const ha=sm(0.4,1.0,t)*(1-sm(4.3,4.9,t));
  if(ha>0){const pu=1+0.06*Math.sin(t*6);heartLine(545,900,60*pu,CO,ha*0.9);bigText('?',545,880,64,CO,ha);}
  fade((1-lit)*0.5,'5,10,20');
  if(t>5.6){const fT=T(6.75,6.2),flip=t>fT;clockPanel(540,480,flip?'07:12':'07:11',flip?1-sm(fT,fT+0.85,t):0,sm(5.6,5.9,t));}
  tag(L('BANYO','BATHROOM'),540,580,TE,sm(5.2,5.6,t));
}
// Koridor (13.85 – 20.6): telaş
const HALLX=[[13.9,420],[14.6,650],[15.3,300],[16.0,580],[16.8,360],[17.8,740],[18.9,800],[19.8,1030]];
function sHall(t){
  room();tag('EV',540,580,AM);frame(110,700);
  const op=sm(17.7,18.0,t)*(1-sm(19.85,19.95,t));
  door(880,op);
  ctx.fillStyle='#2c4772';ctx.fillRect(700,860,120,10);ctx.fillRect(720,870,8,26);ctx.fillRect(780,870,8,26); // askılık
  clockPanel(540,480,fmt(7*60+24+(t-13.9)*2.6),0,1);
  // SEVGİLİ: telefonda; "Görüşürüz" anında başını kaldırır, el yarım kalkar, sonra düşer
  const look=t>18.9, wave_=t>19.1&&t<19.9, after=t>20.0;
  const pp=person({x:220,y:STAND_Y,color:CR,...POSE.stand,facing:1,ua:look?(wave_?110+10*Math.sin(t*12):40):28,fa:look?(wave_?150:60):140,ua2:10,fa2:16,
    look:look?-2:4,nodY:after?7:3,eyes:look&&!after?'wide':(after?'tired':'open'),lean:after?9:3},SEV,CR);
  mouth(pp,1,1,after?-0.6:-0.1);
  if(!look||after)phoneOf(pp,1,false,t);
  // SEN: gidip gelir, kapıdan çıkar
  const x=keyed(t,HALLX), x2=keyed(t+0.05,HALLX), f=x2>=x?1:-1;
  const a=1-sm(19.5,19.85,t);
  if(a>0){const sp=person({...walker(x,t*12,f),color:CO,lean:12,alpha:a,ua2:30,fa2:60},'SEN',CO);mouth(sp,f,1,0);
    popIcon('shoe',sp.head[0],sp.head[1]-200,T(16.0,15.5),t);popIcon('key',sp.head[0],sp.head[1]-200,T(16.8,16.4),t);}
}
// Kanepe (20.6 – 25.2)
function sSofa(t){
  room();windowNight(640,640,300,330,{moon:true,city:true});
  tag(L('AKŞAM','EVENING'),540,580,AM);clockPanel(540,480,'21:40',0,1);floorLamp(130,0.35);
  sofa(220,640);
  const sc=Math.sin(t*9)*3, sc2=Math.sin(t*8+2)*3;
  const sp=person({x:390,y:1300,color:CO,...POSE.sitPhone,facing:-1,fa:140+sc,look:4,nodY:3},'SEN',CO);mouth(sp,-1,1,-0.2);
  const pp=person({x:700,y:1300,color:CR,...POSE.sitPhone,facing:1,fa:140+sc2,look:4,nodY:3},SEV,CR);mouth(pp,1,1,-0.2);
  const two=sm(T(23.2,23.7),T(23.6,24.1),t);
  phoneOf(sp,-1,false,t,{color:TE});phoneOf(pp,1,false,t,{color:TE});
  if(two>0){ctx.save();ctx.globalAlpha=two;ctx.setLineDash([12,12]);ctx.strokeStyle=hexA(CO,0.8);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(545,1000);ctx.lineTo(545,1340);ctx.stroke();ctx.restore();
    for(const p of [[sp,-1],[pp,1]]){const hx=p[0].hand[0]+p[1]*6,hy=p[0].hand[1]-16;ctx.save();ctx.globalAlpha=two*(0.6+0.4*Math.sin(t*8));ctx.strokeStyle=TE;ctx.lineWidth=4;glow(TE,20);ctx.beginPath();ctx.arc(hx,hy,52,0,7);ctx.stroke();ctx.restore();}}
}
// Yatak (25.2 – 29.0)
function sBed(t){
  room();windowNight(640,640,300,330,{moon:true});
  const off=sm(T(28.0,28.5),T(28.3,28.8),t);
  // komodin lambası
  ctx.fillStyle='#1d3254';ctx.fillRect(40,1200,90,200);ctx.save();ctx.globalAlpha=1-off*0.85;ctx.fillStyle=AM;glow(AM,40);ctx.beginPath();ctx.moveTo(55,1150);ctx.lineTo(115,1150);ctx.lineTo(100,1105);ctx.lineTo(70,1105);ctx.closePath();ctx.fill();ctx.restore();noGlow();
  if(off<1)lampCone(85,1150,300,250,1-off);
  bed(190,760);
  const typ=t<25.6?Math.sin(t*30)*5:0;
  const sp=person({x:340,y:1236,color:CO,...POSE.sitPhone,th:90,sh:90,th2:88,sh2:88,facing:1,look:4,nodY:3},'SEN',CO,-40);
  const pp=person({x:500,y:1236,color:CR,...POSE.sitPhone,th:90,sh:90,th2:88,sh2:88,facing:1,fa:140+typ,look:4,nodY:3},SEV,CR,40);
  mouth(sp,1,1,-0.2);mouth(pp,1,1,-0.2);
  // yorgan bacakların üstünde
  ctx.fillStyle='#2b4a7a';rr(300,1196,640,70,26);ctx.fill();ctx.fillStyle=hexA(CR,0.08);rr(300,1196,640,14,8);ctx.fill();
  const got=t>25.55;
  phoneOf(sp,1,got&&t<27.0,t,{buzz:got&&t<26.2?1:0});phoneOf(pp,1,false,t,{color:TE});
  msgCard(540,800,SEV,L('İyi geceler','Good night'),sm(25.55,25.85,t)*(1-sm(28.5,28.9,t)));
  // 20 cm: aradaki mesafe
  const d=sm(27.5,27.9,t)*(1-sm(28.7,28.95,t));
  if(d>0){ctx.save();ctx.globalAlpha=d;ctx.strokeStyle=CO;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(sp.head[0],sp.head[1]-130);ctx.lineTo(pp.head[0],pp.head[1]-130);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sp.head[0],sp.head[1]-145);ctx.lineTo(sp.head[0],sp.head[1]-115);ctx.moveTo(pp.head[0],pp.head[1]-145);ctx.lineTo(pp.head[0],pp.head[1]-115);ctx.stroke();ctx.restore();}
  fade(off*0.45,'5,10,20');
}
// Boş banyo yakın (29.0 – 32.3)
function sSink(t){
  room();tiles();
  ctx.save();ctx.translate(540,1000);ctx.scale(1.25,1.25);ctx.translate(-540,-1000);
  mirror(0.8);mirrorLamp(0.8);
  // aynada sadece iki fırçanın yansıması
  ctx.save();rr(MIR.x,MIR.y,MIR.w,MIR.h,22);ctx.clip();ctx.globalAlpha=0.3;cup(540,1010,2);ctx.restore();
  mirrorFrame(t>31.6?1-sm(31.7,32.3,t)*0.6:0);
  counter(t>30.5&&t<31.7?1-sm(31.0,31.7,t)*0.7:0);cup(700,1160,2);
  ctx.restore();
  tag(L('LAVABO','SINK'),540,1420,AM,sm(30.5,30.8,t));
  tag(L('AYNA','MIRROR'),540,520,AM,sm(31.6,31.9,t));
}
// Uzakta iki kişi (32.3 – 35.9)
function sApart(t){
  room();
  const sc=Math.sin(t*9)*3;
  const sp=person({x:230,y:STAND_Y,color:CO,...POSE.stand,facing:-1,ua:28,fa:140+sc,look:4,nodY:3},'SEN',CO);mouth(sp,-1,1,-0.2);phoneOf(sp,-1,false,t,{color:TE});
  const pp=person({x:850,y:STAND_Y,color:CR,...POSE.stand,facing:1,ua:28,fa:140-sc,look:4,nodY:3},SEV,CR);mouth(pp,1,1,-0.2);phoneOf(pp,1,false,t,{color:TE});
  const ha=sm(32.6,33.2,t), pu=t>34.4?0.5+0.5*Math.sin((t-34.4)*7):0;
  heartLine(540,900,110*(1+0.05*pu),CO,ha*0.9);bigText('?',540,870,110,CO,ha*sm(34.4,34.7,t));
  ctx.save();ctx.globalAlpha=0.5*ha;ctx.setLineDash([10,14]);ctx.strokeStyle=CR;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(320,1150);ctx.lineTo(760,1150);ctx.stroke();ctx.restore();
}
// Sebep kartları (35.9 – 40.2)
function sCards(t){
  room();
  reasonCard(200,800,'cake',L('DOĞUM GÜNÜ','BIRTHDAY'),sm(36.1,36.45,t),sm(T(38.65,39.35),T(38.85,39.55),t));
  reasonCard(540,800,'gift',L('BAYRAM','HOLIDAY'),sm(37.0,37.35,t),sm(T(38.85,39.55),T(39.05,39.75),t));
  reasonCard(880,800,'flower',L('ÖZÜR','SORRY'),sm(37.8,38.15,t),sm(T(39.05,39.75),T(39.25,39.95),t));

  // çizim sırası: sarılan kollar önde kalsın
  const pp=person({...po,color:CR,facing:pf},SEV,CR,70);
