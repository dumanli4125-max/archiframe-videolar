<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../kit/engine.js"></script>
<script>
// 10 — Normal dediğin ne? Satır başlangıçları audio.py VO ile AYNI (zamanlama.json).
const DURATION = 61;
const AM=C.amber, CO=C.coral, TE=C.teal, CR=C.cream;
const RED='#e5484d', HONEY='#f2a73b';

// ---------- yardımcılar ----------
// ağız: k=1 gülümseme, 0 düz, -1 surat
function mouth(fig,f,s,k){const h=fig.head,x=h[0]+18*f*s,y=h[1]+15*s;ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=5*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-12*s,y-3*s*k);ctx.quadraticCurveTo(x,y+13*s*k,x+12*s,y-3*s*k);ctx.stroke();ctx.restore();}
// açık ağız (çiğneme / gülme): o = 0..1
function openMouth(fig,f,s,o){const h=fig.head,x=h[0]+18*f*s,y=h[1]+16*s;ctx.save();ctx.fillStyle=C.ink;ctx.beginPath();ctx.ellipse(x,y,10*s,(3+9*o)*s,0,0,7);ctx.fill();ctx.restore();}
// buruşuk surat: > < gözler + dalgalı ağız (figure gözlerinin üstüne boyar)
function scrunch(fig,f,s,col){const h=fig.head,ey=h[1]-4*s;ctx.save();
  for(const [dx,dir] of [[10,1],[27,-1]]){const ex=h[0]+dx*f*s;ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,8.5*s,0,7);ctx.fill();
    ctx.strokeStyle=C.ink;ctx.lineWidth=4.5*s;ctx.lineCap='round';ctx.beginPath();const d=dir*f;ctx.moveTo(ex-6*s*d,ey-6*s);ctx.lineTo(ex+5*s*d,ey);ctx.lineTo(ex-6*s*d,ey+6*s);ctx.stroke();}
  const x=h[0]+18*f*s,y=h[1]+17*s;ctx.strokeStyle=C.ink;ctx.lineWidth=4.5*s;ctx.beginPath();
  for(let i=0;i<=8;i++){const xx=x-14*s+i*3.5*s,yy=y+(i%2?-4:3)*s;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();ctx.restore();}
// gülen gözler (^ ^)
function happyEyes(fig,f,s,col){const h=fig.head,ey=h[1]-4*s;ctx.save();
  for(const dx of [10,27]){const ex=h[0]+dx*f*s;ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,8.5*s,0,7);ctx.fill();
    ctx.strokeStyle=C.ink;ctx.lineWidth=5*s;ctx.lineCap='round';ctx.beginPath();ctx.arc(ex,ey+4*s,7*s,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}
  ctx.restore();}
function txt(s,x,y,size,col,align='left',weight=700){ctx.font=`${weight} ${size}px Inter`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.letterSpacing='0px';ctx.fillStyle=col;ctx.fillText(s,x,y);}
function walker(x,p,f,s=1,extra={}){return {x,y:standY(s)-walkBob(p),s,facing:f,...walk(p),...extra};}
function sen(o){const p=figure({color:CO,...o});tag('SEN',p.head[0],p.head[1]-92*(o.s||1),CO,o.alpha??1);return p;}
// damga etiketi: NORMAL / İĞRENÇ (pop ile gelir)
function stamp(text,x,y,col,a,rot=-0.1,size=64){if(a<=0)return;const k=1+0.6*(1-sm(0,1,a));ctx.save();ctx.globalAlpha=clamp(a*1.4);ctx.translate(x,y);ctx.rotate(rot);ctx.scale(k,k);
  ctx.font=`800 ${size}px Inter`;ctx.letterSpacing='4px';const w=ctx.measureText(text).width+56,h=size*1.5;
  rr(-w/2,-h/2,w,h,16);ctx.fillStyle='rgba(8,17,32,.82)';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=col;glow(col,24);ctx.stroke();noGlow();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(text,2,4);ctx.restore();}
const NORMAL=()=>L('NORMAL','NORMAL'), GROSS=()=>L('İĞRENÇ','GROSS');
// iki yüzlü damga: önce İĞRENÇ, flip anında NORMAL'e döner (dikey çevirme)
function flipStamp(x,y,a,tf,t,rot=-0.1,size=64){if(a<=0)return;const k=Math.abs(Math.cos(Math.PI*sm(tf-0.25,tf+0.25,t)));const nrm=t>tf;
  ctx.save();ctx.translate(x,y);ctx.scale(1,Math.max(0.04,k));ctx.translate(-x,-y);stamp(nrm?NORMAL():GROSS(),x,y,nrm?TE:RED,a,rot,size);ctx.restore();}
function crunch(x,y,t0,t){const u=(t-t0)/0.5;if(u<0||u>1)return;ctx.save();ctx.globalAlpha=1-u;ctx.strokeStyle=AM;ctx.lineWidth=5;ctx.lineCap='round';glow(AM,12);
  for(let i=0;i<5;i++){const a=-Math.PI/2+(i-2)*0.5,r0=24+u*20,r1=44+u*36;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);ctx.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);ctx.stroke();}
  ctx.font='800 34px Inter';ctx.textAlign='center';ctx.fillStyle=AM;ctx.fillText(L('KITIR','CRUNCH'),x,y-60-u*30);ctx.restore();}
function qmark(x,y,a,t,size=90){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font=`800 ${size}px Inter`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=AM;glow(AM,24);
  ctx.fillText('?',x,y+Math.sin(t*3)*8);ctx.restore();}

// ---------- YİYECEKLER ----------
function honeyJar(x,y,s=1,lvl=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s); // y = dip
  rr(-40,-92,80,92,16);ctx.fillStyle='rgba(255,220,170,.18)';ctx.fill();
  ctx.save();rr(-40,-92,80,92,16);ctx.clip();const g=ctx.createLinearGradient(0,-80,0,0);g.addColorStop(0,'#ffcf6b');g.addColorStop(1,'#d9831f');ctx.fillStyle=g;glow(HONEY,30);ctx.fillRect(-40,-80*lvl,80,80*lvl);ctx.restore();noGlow();
  ctx.strokeStyle='rgba(255,236,200,.6)';ctx.lineWidth=3;rr(-40,-92,80,92,16);ctx.stroke();
  ctx.fillStyle='#7a4a22';rr(-44,-108,88,20,6);ctx.fill();
  ctx.fillStyle='#f6efe0';rr(-28,-62,56,30,6);ctx.fill();txt(L('BAL','HONEY'),0,-46,L(20,16),'#7a4a22','center',800);
  ctx.restore();}
function breadSlice(x,y,s=1,rot=0,honey=0,bite=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle='#b9732f';ctx.beginPath();ctx.ellipse(0,0,34,24,0,0,7);ctx.fill();ctx.fillStyle='#f0d29a';ctx.beginPath();ctx.ellipse(0,0,28,18,0,0,7);ctx.fill();
  if(honey>0){ctx.fillStyle=hexA(HONEY,0.9*honey);glow(HONEY,14);ctx.beginPath();ctx.ellipse(6,-2,22*honey,13*honey,0.2,0,7);ctx.fill();noGlow();
    ctx.fillStyle=hexA(HONEY,0.9*honey);ctx.beginPath();ctx.ellipse(20,14,4,8,0,0,7);ctx.fill();}
  if(bite>0){ctx.globalCompositeOperation='destination-out';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(30,-14+i*13,10*bite,0,7);ctx.fill();}}
  ctx.restore();}
function teaGlass(x,y,t){ctx.save();ctx.fillStyle='#f6efe0';ctx.beginPath();ctx.ellipse(x,y,34,8,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-16,y-6);ctx.quadraticCurveTo(x-24,y-34,x-14,y-46);ctx.lineTo(x-18,y-64);ctx.lineTo(x+18,y-64);ctx.lineTo(x+14,y-46);ctx.quadraticCurveTo(x+24,y-34,x+16,y-6);ctx.closePath();
  ctx.fillStyle='rgba(190,60,30,.85)';glow('rgba(255,120,60,.6)',16);ctx.fill();noGlow();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle=hexA(CR,0.35);ctx.lineWidth=3;for(let i=-1;i<=1;i+=2){ctx.beginPath();for(let k=0;k<=8;k++){const yy=y-72-k*5,xx=x+i*7+Math.sin(k*0.8+t*4+i)*4;k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}
  ctx.restore();}
function cheeseOlive(x,y){ctx.save();ctx.fillStyle='#f6efe0';ctx.beginPath();ctx.ellipse(x,y,50,11,0,0,7);ctx.fill();
  ctx.fillStyle='#f4ecd6';ctx.fillRect(x-38,y-26,40,22);ctx.fillStyle='#2e2a26';for(const [dx,dy] of [[16,-12],[30,-10],[23,-20]]){ctx.beginPath();ctx.ellipse(x+dx,y+dy,8,10,0.3,0,7);ctx.fill();}ctx.restore();}
// çekirge (kızarmış)
function hopper(x,y,s=1,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle='#a8742e';ctx.beginPath();ctx.ellipse(0,0,34,11,0,0,7);ctx.fill();
  ctx.fillStyle='#8a5a22';ctx.beginPath();ctx.arc(34,-3,11,0,7);ctx.fill();
  ctx.fillStyle='#1a1208';ctx.beginPath();ctx.arc(39,-6,3,0,7);ctx.fill();
  ctx.strokeStyle='#7a4a1a';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-6,-6);ctx.lineTo(-22,-26);ctx.lineTo(-40,6);ctx.stroke();
  ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(40,-12);ctx.quadraticCurveTo(52,-34,64,-30);ctx.moveTo(36,-13);ctx.quadraticCurveTo(44,-38,56,-40);ctx.stroke();
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(10,8);ctx.lineTo(16,22);ctx.moveTo(20,8);ctx.lineTo(28,20);ctx.stroke();
  ctx.strokeStyle='rgba(255,220,150,.35)';ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*10,-9);ctx.lineTo(i*10+3,9);ctx.stroke();}
  ctx.restore();}
function skewer(x,y,s=1,rot=-0.05,n=3){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.strokeStyle='#d9c08a';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(-70*s,0);ctx.lineTo(70*s+n*0,0);ctx.stroke();
  for(let i=0;i<n;i++)hopper((-40+i*40)*s,0,0.55*s,0);ctx.restore();}
function snail(x,y,s=1,t=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#b99b78';ctx.beginPath();ctx.ellipse(10,14,40,9,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(46,4,8,0,7);ctx.fill();
  ctx.strokeStyle='#b99b78';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(46,0);ctx.lineTo(50,-14+Math.sin(t*3)*2);ctx.moveTo(42,0);ctx.lineTo(40,-12);ctx.stroke();
  ctx.fillStyle='#8a5a32';ctx.beginPath();ctx.arc(0,-6,24,0,7);ctx.fill();ctx.strokeStyle='#d9a56a';ctx.lineWidth=4;ctx.beginPath();
  for(let k=0;k<=40;k++){const a=k*0.42,r=20-k*0.45;const xx=Math.cos(a)*r,yy=-6+Math.sin(a)*r;k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();
  ctx.fillStyle='#5f9a4a';ctx.beginPath();ctx.arc(-6,-4,3,0,7);ctx.arc(8,-14,3,0,7);ctx.fill();ctx.restore();}
function bigPlate(x,y,w=200){ctx.save();ctx.fillStyle='#f6efe0';glow('rgba(0,0,0,.4)',14);ctx.beginPath();ctx.ellipse(x,y,w/2,w*0.14,0,0,7);ctx.fill();noGlow();
  ctx.strokeStyle='rgba(120,110,90,.4)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,w*0.38,w*0.1,0,0,7);ctx.stroke();ctx.restore();}
function moldCheese(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#f3e3b0';ctx.beginPath();ctx.moveTo(-80,20);ctx.lineTo(80,20);ctx.lineTo(80,-30);ctx.lineTo(-80,-10);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e2cc8a';ctx.beginPath();ctx.moveTo(-80,-10);ctx.lineTo(80,-30);ctx.lineTo(60,-44);ctx.lineTo(-90,-18);ctx.closePath();ctx.fill();
  ctx.fillStyle='#4f8a86';for(const [dx,dy,r] of [[-50,4,7],[-20,-2,5],[10,8,8],[40,-6,6],[60,8,5],[-62,-4,4],[24,-12,4],[-6,10,4]]){ctx.beginPath();ctx.arc(dx,dy,r,0,7);ctx.fill();}
  ctx.fillStyle='#3b6f6b';for(const [dx,dy] of [[-40,-24],[0,-30],[30,-34]]){ctx.beginPath();ctx.arc(dx,dy,4,0,7);ctx.fill();}ctx.restore();}
// kokoreç dürüm / yarım ekmek
function kokorecSandwich(x,y,s=1,rot=0,bite=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle='#c8873e';rr(-56,-16,112,34,16);ctx.fill();
  ctx.fillStyle='#7a4a26';for(let i=0;i<9;i++){ctx.beginPath();ctx.ellipse(-44+i*11,-16,8,6,0.4*i,0,7);ctx.fill();}
  ctx.fillStyle='#c0392b';for(let i=0;i<7;i++){ctx.fillRect(-40+i*13,-24+(i%2)*4,3,3);}
  ctx.fillStyle='#5f9a4a';ctx.fillRect(-30,-22,8,4);ctx.fillRect(14,-21,8,4);
  ctx.fillStyle='#e0a25a';rr(-56,-4,112,22,10);ctx.fill();
  if(bite>0){ctx.globalCompositeOperation='destination-out';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(56,-14+i*13,11*bite,0,7);ctx.fill();}}
  ctx.restore();}
// döner kokoreç şişi (ızgara üstünde)
function kokorecSpit(x,y,t,w=300){ctx.save();
  ctx.fillStyle='#2a1a12';rr(x-w/2-20,y+34,w+40,26,8);ctx.fill();
  for(let i=0;i<8;i++){const fl=0.6+0.4*Math.sin(t*9+i*1.7);ctx.fillStyle=hexA('#ff7a2a',0.55*fl);glow('#ff7a2a',20);ctx.beginPath();ctx.ellipse(x-w/2+20+i*(w-40)/7,y+34,14,10+8*fl,0,Math.PI,0);ctx.fill();}noGlow();
  ctx.strokeStyle='#9aa4b8';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x-w/2-40,y);ctx.lineTo(x+w/2+40,y);ctx.stroke();
  rr(x-w/2,y-30,w,60,30);ctx.fillStyle='#8a5530';glow('rgba(255,140,60,.5)',24);ctx.fill();noGlow();
  ctx.save();rr(x-w/2,y-30,w,60,30);ctx.clip();ctx.strokeStyle='#c98a4a';ctx.lineWidth=8;const ph=(t*60)%36;
  for(let xx=x-w/2-60+ph;xx<x+w/2+60;xx+=36){ctx.beginPath();ctx.moveTo(xx,y-34);ctx.lineTo(xx+30,y+34);ctx.stroke();}ctx.restore();
  ctx.restore();}
// arı
function bee(x,y,t,s=1,f=1){ctx.save();ctx.translate(x,y);ctx.scale(s*f,s);
  const wf=Math.sin(t*60);ctx.fillStyle='rgba(220,240,255,.55)';ctx.beginPath();ctx.ellipse(-4,-20,14,24*(0.6+0.4*Math.abs(wf)),-0.4,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(10,-18,12,20*(0.6+0.4*Math.abs(wf)),0.4,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.ellipse(0,0,30,20,0,0,7);ctx.clip();ctx.fillStyle='#ffc23a';glow('#ffc23a',20);ctx.fillRect(-30,-20,60,40);noGlow();ctx.fillStyle='#1a1410';for(const xx of [-14,0,14])ctx.fillRect(xx-4,-20,8,40);ctx.restore();
  ctx.fillStyle='#1a1410';ctx.beginPath();ctx.arc(30,-2,12,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(34,-6,4,0,7);ctx.fill();
  ctx.strokeStyle='#1a1410';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-40,2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(34,-12);ctx.quadraticCurveTo(40,-26,48,-26);ctx.stroke();ctx.restore();}
function flower(x,y,t,a=1){ctx.save();ctx.strokeStyle='#2f6b62';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x,1400);ctx.quadraticCurveTo(x-30,y+200,x,y);ctx.stroke();
  ctx.fillStyle='#2f6b62';ctx.beginPath();ctx.ellipse(x-40,y+190,40,14,-0.5,0,7);ctx.fill();
  const r=Math.sin(t*1.5)*0.05;ctx.translate(x,y);ctx.rotate(r);
  for(let i=0;i<8;i++){ctx.save();ctx.rotate(i*Math.PI/4);ctx.fillStyle=i%2?'#ff8f7f':CO;glow(CO,10);ctx.beginPath();ctx.ellipse(0,-44,20,38,0,0,7);ctx.fill();ctx.restore();}
  ctx.fillStyle=AM;glow(AM,30);ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.fill();ctx.restore();}
function hex(x,y,r){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}
const CELLS=(()=>{const a=[];for(let r=0;r<5;r++)for(let c=0;c<4;c++)a.push([700+c*64+(r%2)*32,860+r*56]);return a;})();
function comb(t,fill){ // fill: hücre başına 0..1 dizisi
  ctx.save();rr(650,800,330,330,24);ctx.fillStyle='#3a2a14';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=hexA(AM,0.5);ctx.stroke();
  CELLS.forEach(([x,y],i)=>{hex(x,y,30);ctx.fillStyle='#5a4220';ctx.fill();const f=fill(i);if(f>0){hex(x,y,30*f);ctx.fillStyle=HONEY;glow(HONEY,16*f);ctx.fill();noGlow();}
    hex(x,y,30);ctx.strokeStyle='#c9902a';ctx.lineWidth=4;ctx.stroke();});ctx.restore();}

// ---------- MEKÂNLAR ----------
function windowDay(x,y,w,h,t){ctx.save();rr(x,y,w,h,10);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#3d6fa8');g.addColorStop(1,'#ffcf8a');ctx.fillStyle=g;ctx.fill();ctx.clip();
  ctx.fillStyle='#ffe2a0';glow('#ffd27a',50);ctx.beginPath();ctx.arc(x+w*0.7,y+h*0.62,44,0,7);ctx.fill();noGlow();ctx.restore();
  ctx.strokeStyle=C.line;ctx.lineWidth=6;rr(x,y,w,h,10);ctx.stroke();ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.lineWidth=4;ctx.stroke();
  const g2=ctx.createLinearGradient(x,y+h,x+260,y+h+500);g2.addColorStop(0,hexA(AM,0.16));g2.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g2;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w+320,1400);ctx.lineTo(x+180,1400);ctx.closePath();ctx.fill();}
const TBL={x:330,w:640,top:1240};
function kitchen(t,o={}){room();windowDay(620,560,320,360,t);
  // tablo/raf
  ctx.fillStyle='#1d3254';ctx.fillRect(80,760,300,12);ctx.fillStyle='#2b4a7a';rr(110,700,40,60,6);ctx.fill();rr(170,712,34,48,6);ctx.fill();honeyJar(270,760,0.6);
  chair(200);
  desk(TBL.x,TBL.w,TBL.top);ctx.fillStyle='#f6efe0';ctx.globalAlpha=0.08;ctx.fillRect(TBL.x,TBL.top-4,TBL.w,6);ctx.globalAlpha=1;
  honeyJar(450,TBL.top,1,1);
  bigPlate(590,TBL.top-6,150);breadSlice(570,TBL.top-22,0.9,0.1);breadSlice(615,TBL.top-30,0.9,-0.15);
  teaGlass(750,TBL.top-4,t);cheeseOlive(880,TBL.top-6);
}
// SEN masada: k = kol pozu (0=dinlen, 1=bala batır, 2=ağza), honey/bite ekmeğe
const ARM_REST={ua:62,fa:100}, ARM_DIP={ua:96,fa:132}, ARM_EAT={ua:28,fa:168};
function armAt(t,kf){ // kf: [[t,poseName],...] yumuşak geçiş
  const P={r:ARM_REST,d:ARM_DIP,e:ARM_EAT};let a=P[kf[0][1]];
  for(let i=1;i<kf.length;i++){const k=sm(kf[i][0]-0.3,kf[i][0],t);if(k>0)a={ua:lerp(a.ua,P[kf[i][1]].ua,k),fa:lerp(a.fa,P[kf[i][1]].fa,k)};}return a;}
function senTable(t,arm,o={}){const p={x:260,y:1322,...POSE.sit,ua2:30,fa2:70,facing:1,...arm,eyes:o.eyes||'open',lean:o.lean??4};
  const f=sen(p);
  if(o.happy)happyEyes(f,1,1,CO);
  if(o.chew>0)openMouth(f,1,1,0.5+0.5*Math.sin(t*16));else mouth(f,1,1,o.mouth??0.6);
  if(o.bread!==false)breadSlice(f.hand[0]+10,f.hand[1]-6,0.85,-0.3,o.honey||0,o.bite||0);
  return f;}

// sokak/pazar zemini
function nightStreet(t,o={}){const g=ctx.createLinearGradient(0,0,0,1400);g.addColorStop(0,'#0c1830');g.addColorStop(1,'#16274a');ctx.fillStyle=g;ctx.fillRect(0,0,W,1400);
  ctx.fillStyle=C.floor;ctx.fillRect(0,1400,W,H-1400);ctx.strokeStyle=hexA(C.line,0.6);ctx.lineWidth=2;for(let k=1;k<7;k++){const y=1400+Math.pow(k/7,1.8)*520;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // ip ışıkları
  if(o.lights!==false){ctx.strokeStyle='rgba(239,228,207,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,620);ctx.quadraticCurveTo(540,720,1080,620);ctx.stroke();
