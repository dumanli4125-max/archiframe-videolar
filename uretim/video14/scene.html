<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../kit/engine.js"></script>
<script>
// 14 — Uçak mı, araba mı? Satır başlangıçları audio.py VO ile AYNI (zamanlama.json):
// l01 0.3 | l02 5.25 | l03 10.85 | l04 14.9 | l05 20.65 | l06 25.4 | l07 30.25 | l08 33.9 | l09 36.95 | l10 41.6 | l11 46.25 | l12 51.6
const DURATION = 59.5;
const AM=C.amber, CO=C.coral, TE=C.teal, CR=C.cream, W1='#fff', RED='#ff3b3b';

// ---------- yardımcılar ----------
function mouth(fig,f,s,k){const h=fig.head,x=h[0]+18*f*s,y=h[1]+15*s;ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=5*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-12*s,y-3*s*k);ctx.quadraticCurveTo(x,y+13*s*k,x+12*s,y-3*s*k);ctx.stroke();ctx.restore();}
function openMouth(fig,f,s,o){const h=fig.head,x=h[0]+18*f*s,y=h[1]+16*s;ctx.save();ctx.fillStyle=C.ink;ctx.beginPath();ctx.ellipse(x,y,10*s,(3+9*o)*s,0,0,7);ctx.fill();ctx.restore();}
function happyEyes(fig,f,s,col){const h=fig.head,ey=h[1]-4*s;ctx.save();
  for(const dx of [10,27]){const ex=h[0]+dx*f*s;ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,8.5*s,0,7);ctx.fill();
    ctx.strokeStyle=C.ink;ctx.lineWidth=5*s;ctx.lineCap='round';ctx.beginPath();ctx.arc(ex,ey+4*s,7*s,Math.PI*1.15,Math.PI*1.85);ctx.stroke();}
  ctx.restore();}
function txt(s,x,y,size,col,align='left',weight=700){ctx.font=`${weight} ${size}px Inter`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.letterSpacing='0px';ctx.fillStyle=col;ctx.fillText(s,x,y);}
function sen(o){const p=figure({color:CO,...o});tag('SEN',p.head[0],p.head[1]-92*(o.s||1),CO,o.alpha??1);return p;}
function qmark(x,y,a,t,size=90){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.font=`800 ${size}px Inter`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=AM;glow(AM,24);
  ctx.fillText('?',x,y+Math.sin(t*3)*8);ctx.restore();}
function stamp(text,x,y,col,a,rot=-0.1,size=64){if(a<=0)return;const k=1+0.6*(1-sm(0,1,a));ctx.save();ctx.globalAlpha=clamp(a*1.4);ctx.translate(x,y);ctx.rotate(rot);ctx.scale(k,k);
  ctx.font=`800 ${size}px Inter`;ctx.letterSpacing='4px';const w=ctx.measureText(text).width+56,h=size*1.5;
  rr(-w/2,-h/2,w,h,16);ctx.fillStyle='rgba(8,17,32,.82)';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle=col;glow(col,24);ctx.stroke();noGlow();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(text,2,4);ctx.restore();}
function cam(z,fx=540,fy=1150){ctx.translate(540,1150);ctx.scale(z,z);ctx.translate(-fx,-fy);}
// ter damlaları
function sweat(fig,t,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#9fe8ff';glow('#9fe8ff',10);
  for(let i=0;i<3;i++){const u=((t*1.3+i*0.33)%1);const x=fig.head[0]+(i===1?-34:44)+i*4,y=fig.head[1]-30+u*60;ctx.globalAlpha=a*(1-u);
    ctx.beginPath();ctx.moveTo(x,y-10);ctx.quadraticCurveTo(x+7,y+2,x,y+6);ctx.quadraticCurveTo(x-7,y+2,x,y-10);ctx.fill();}ctx.restore();}
// titreme çizgileri (el/gövde yanında)
function shakeMarks(x,y,t,a=1,col=AM){if(a<=0)return;ctx.save();ctx.globalAlpha=a*(0.6+0.4*Math.sin(t*30));ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';
  for(const s of [-1,1]){ctx.beginPath();ctx.arc(x,y,34,s>0?-0.6:Math.PI-0.6,s>0?0.6:Math.PI+0.6);ctx.stroke();ctx.beginPath();ctx.arc(x,y,50,s>0?-0.5:Math.PI-0.5,s>0?0.5:Math.PI+0.5);ctx.stroke();}ctx.restore();}
function note(x,y,a,col=AM){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=4;glow(col,12);
  ctx.beginPath();ctx.ellipse(x,y,10,7,-0.4,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x+9,y-2);ctx.lineTo(x+9,y-34);ctx.lineTo(x+22,y-26);ctx.stroke();ctx.restore();}
// ikonlar
function planeIcon(x,y,s=1,col=TE,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.fillStyle=col;glow(col,16);
  rr(-60,-9,120,18,9);ctx.fill();ctx.beginPath();ctx.moveTo(-10,-6);ctx.lineTo(18,-6);ctx.lineTo(-14,-48);ctx.lineTo(-26,-48);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-10,6);ctx.lineTo(18,6);ctx.lineTo(-14,48);ctx.lineTo(-26,48);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-50,-4);ctx.lineTo(-38,-4);ctx.lineTo(-52,-26);ctx.lineTo(-60,-26);ctx.closePath();ctx.fill();ctx.restore();}
function planeSide(x,y,s=1,col='#dfe8f2',rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.fillStyle=col;
  rr(-150,-22,300,44,22);ctx.fill();ctx.beginPath();ctx.moveTo(-120,-18);ctx.lineTo(-150,-80);ctx.lineTo(-118,-80);ctx.lineTo(-80,-18);ctx.fill();
  ctx.fillStyle='#b9c6d6';ctx.beginPath();ctx.moveTo(-20,8);ctx.lineTo(40,8);ctx.lineTo(-10,52);ctx.lineTo(-40,52);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3b5f8a';for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(-80+i*24,-4,4,0,7);ctx.fill();}ctx.fillStyle=TE;ctx.fillRect(-150,8,300,5);ctx.restore();}
function carIcon(x,y,s=1,col=CO){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col;glow(col,16);
  rr(-70,-20,140,40,14);ctx.fill();ctx.beginPath();ctx.moveTo(-42,-20);ctx.lineTo(-24,-48);ctx.lineTo(28,-48);ctx.lineTo(46,-20);ctx.closePath();ctx.fill();noGlow();
  ctx.fillStyle='rgba(8,17,32,.7)';ctx.beginPath();ctx.moveTo(-32,-22);ctx.lineTo(-20,-42);ctx.lineTo(0,-42);ctx.lineTo(0,-22);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(6,-22);ctx.lineTo(6,-42);ctx.lineTo(24,-42);ctx.lineTo(36,-22);ctx.closePath();ctx.fill();
  ctx.fillStyle='#0a1222';for(const dx of [-40,40]){ctx.beginPath();ctx.arc(dx,20,15,0,7);ctx.fill();}ctx.fillStyle='#8a94a8';for(const dx of [-40,40]){ctx.beginPath();ctx.arc(dx,20,6,0,7);ctx.fill();}ctx.restore();}

// ---------- UÇAK KABİNİ ----------
function cabin(t,o={}){
  const climb=o.climb||0; // 0 yerde, 1 havada
  ctx.fillStyle='#16294a';ctx.fillRect(0,0,W,H);
  // tavan / dolaplar
  ctx.fillStyle='#1d3459';rr(-40,560,W+80,150,40);ctx.fill();ctx.fillStyle='#24406b';for(let i=0;i<4;i++){rr(20+i*270,580,250,100,14);ctx.fill();}
  ctx.fillStyle='#0f1d33';ctx.fillRect(0,700,W,10);
  // pencereler
  for(const wx of [180,540,900]){ctx.save();ctx.beginPath();ctx.ellipse(wx,900,62,84,0,0,7);ctx.fillStyle='#24406b';ctx.fill();ctx.beginPath();ctx.ellipse(wx,900,50,72,0,0,7);ctx.clip();
    const g=ctx.createLinearGradient(0,820,0,980);g.addColorStop(0,'#3d6fa8');g.addColorStop(1,'#9fc7e8');ctx.fillStyle=g;ctx.fillRect(wx-60,820,120,170);
    // zemin (kalkışta aşağı kayar)
    const gy=930+climb*220;ctx.fillStyle='#2f5a4a';ctx.fillRect(wx-60,gy,120,200);ctx.fillStyle='#5a6478';ctx.fillRect(wx-60,gy,120,8);
    // bulutlar
    const off=((o.cloud||0)+wx)%160;ctx.fillStyle='rgba(255,255,255,.85)';for(let k=-1;k<2;k++){ctx.beginPath();ctx.ellipse(wx-80+off+k*160,880+climb*10,30,12,0,0,7);ctx.fill();}
    ctx.restore();ctx.lineWidth=4;ctx.strokeStyle='#3a5a88';ctx.beginPath();ctx.ellipse(wx,900,50,72,0,0,7);ctx.stroke();}
  // zemin
  ctx.fillStyle='#0d1a30';ctx.fillRect(0,1400,W,H-1400);ctx.fillStyle='#3a2340';ctx.fillRect(0,1400,W,40);
  // arka koltuk (SEN'in koltuğu) ve öndeki sıra
  seat(330);seat(700);
}
function seat(x){ctx.fillStyle='#2b4a7a';rr(x,1060,62,290,20);ctx.fill();ctx.fillStyle='#ffb547';ctx.globalAlpha=0.25;rr(x+8,1070,46,40,10);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle='#24406b';rr(x+10,1322,190,44,14);ctx.fill();ctx.fillRect(x+90,1366,14,34);}
function armrest(){ctx.fillStyle='#3a5a88';rr(400,1280,140,18,8);ctx.fill();}
function lapBelt(fig,a=1,glowK=0){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=TE;glow(TE,10+20*glowK);ctx.fillRect(398,1300,96,14);ctx.fillStyle=AM;rr(436,1296,26,22,4);ctx.fill();ctx.restore();}
function hostess(x,y,o,t){const p=figure({x,y,s:1,color:CR,facing:-1,...o.pose});
  ctx.save();ctx.fillStyle=AM;rr(p.head[0]-26,p.head[1]-52,52,18,6);ctx.fill();ctx.beginPath();ctx.moveTo(p.sh[0]-22,p.sh[1]+6);ctx.lineTo(p.sh[0]+22,p.sh[1]+6);ctx.lineTo(p.sh[0],p.sh[1]+40);ctx.closePath();ctx.fill();ctx.restore();
  if(o.smile){happyEyes(p,-1,1,CR);mouth(p,-1,1,1);}else mouth(p,-1,1,0.4);
  tag(L('HOSTES','FLIGHT ATTENDANT'),p.head[0],p.head[1]-100,CR,o.label??1);return p;}
// SEN kabinde: mode 'grip' | 'relax' | 'pray'
function senSeat(t,o={}){const jit=(o.shake||0)*Math.sin(t*55)*3;
  const grip={ua:40,fa:60,ua2:44,fa2:66},relax={ua:30,fa:80,ua2:28,fa2:76},pray={ua:52,fa:158,ua2:48,fa2:162};
  let arm=grip;if(o.relax)arm={...arm,...Object.fromEntries(Object.keys(grip).map(k=>[k,lerp(grip[k],relax[k],o.relax)]))};
  if(o.pray)arm=Object.fromEntries(Object.keys(grip).map(k=>[k,lerp(arm[k],pray[k],o.pray)]));
  const f=sen({x:420+jit,y:1322,...POSE.sit,lean:(o.lean??2)+jit*0.5,...arm,eyes:o.eyes||'wide'});
  if(o.happy){happyEyes(f,1,1,CO);mouth(f,1,1,0.8);}else mouth(f,1,1,o.mouth??-0.6);
  return f;}

// ---------- HAVALİMANI ----------
function gate(t){room();
  ctx.save();rr(80,520,920,520,14);const g=ctx.createLinearGradient(0,520,0,1040);g.addColorStop(0,'#3d6fa8');g.addColorStop(1,'#ffcf8a');ctx.fillStyle=g;ctx.fill();ctx.clip();
  ctx.fillStyle='#3a4660';ctx.fillRect(80,960,920,80);planeSide(560+Math.sin(t)*4,930,1.6);ctx.restore();
  ctx.strokeStyle=C.line;ctx.lineWidth=8;rr(80,520,920,520,14);ctx.stroke();for(const x of [310,540,770]){ctx.beginPath();ctx.moveTo(x,520);ctx.lineTo(x,1040);ctx.stroke();}
  // kalkış tabelası
  card(540,440,520,110,{stroke:AM});ctx.save();ctx.font='800 34px "DejaVu Sans Mono"';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=AM;glow(AM,14);ctx.fillText(L('KALKIŞ  B12  BİNİŞ','GATE B12  BOARDING'),540,442);ctx.restore();
  // bekleme koltukları
  for(let i=0;i<4;i++){ctx.fillStyle='#22385c';rr(120+i*130,1300,110,30,10);ctx.fill();rr(124+i*130,1220,102,80,14);ctx.fill();ctx.fillRect(170+i*130,1330,10,70);}
}
function exitHall(t){room();
  ctx.save();rr(80,520,920,520,14);const g=ctx.createLinearGradient(0,520,0,1040);g.addColorStop(0,'#3d6fa8');g.addColorStop(1,'#ffcf8a');ctx.fillStyle=g;ctx.fill();ctx.clip();
  ctx.fillStyle='#3a4660';ctx.fillRect(80,960,920,80);planeSide(lerp(1100,500,sm(20.5,21.4,t)),lerp(780,920,sm(20.5,21.4,t)),1.2,'#dfe8f2',lerp(-0.12,0,sm(20.5,21.4,t)));ctx.restore();
  ctx.strokeStyle=C.line;ctx.lineWidth=8;rr(80,520,920,520,14);ctx.stroke();
  card(540,440,420,110,{stroke:TE});txt(L('ÇIKIŞ  →','EXIT  →'),540,442,40,TE,'center',800);}

// ---------- ARABA (yandan kesit) ----------
const CAR={x0:40,x1:880,belt:360,hip:410,wheel:[545,1195]};
function speedAt(t){ // px/sn
  if(t<5.2)return 380;
  if(t<41)return lerp(380,1100,sm(28.7,29.5,t));
  return 650*(1-sm(46.45,47.95,t));}
function roadPos(t){let p=0;const t0=t<41?2.55:41.5;for(let u=t0;u<t;u+=1/30)p+=speedAt(u)/30;return p;}
function outside(t,pos){
  const g=ctx.createLinearGradient(0,0,0,1540);g.addColorStop(0,'#0f1d33');g.addColorStop(0.65,'#2b3f6a');g.addColorStop(1,'#d9875a');ctx.fillStyle=g;ctx.fillRect(-700,-200,W+1400,1740);
  // şehir silueti (yavaş kayar)
  ctx.fillStyle='#14233f';const o1=(pos*0.15)%900;
  for(let k=-1;k<3;k++)[[0,260,110],[120,200,90],[230,330,120],[370,170,80],[470,250,120],[610,140,90],[720,290,100],[840,210,60]].forEach(([dx,h,bw])=>{const x=dx+k*900-o1;ctx.fillRect(x,1280-h,bw,h+260);
    ctx.fillStyle='rgba(255,181,71,.35)';for(let j=0;j<4;j++)ctx.fillRect(x+14+(j%2)*36,1300-h+30+Math.floor(j/2)*50,14,18);ctx.fillStyle='#14233f';});
  // sokak lambaları (hızlı)
  const o2=pos%520;for(let k=-2;k<5;k++){const x=k*520-o2+200;ctx.strokeStyle='#2c4772';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x,1540);ctx.lineTo(x,900);ctx.lineTo(x+60,900);ctx.stroke();
    ctx.save();ctx.fillStyle=AM;glow(AM,30);ctx.beginPath();ctx.arc(x+62,912,12,0,7);ctx.fill();ctx.restore();}
  // yol
  ctx.fillStyle='#1a2235';ctx.fillRect(-700,1540,W+1400,H);ctx.fillStyle='#2c3550';ctx.fillRect(-700,1540,W+1400,10);
  const o3=pos%220;ctx.fillStyle='rgba(239,228,207,.7)';for(let k=-4;k<10;k++)ctx.fillRect(k*220-o3,1700,120,12);
}
function wheel(x,y,pos){ctx.fillStyle='#0a1222';ctx.beginPath();ctx.arc(x,y,62,0,7);ctx.fill();ctx.fillStyle='#5a6478';ctx.beginPath();ctx.arc(x,y,30,0,7);ctx.fill();
  ctx.strokeStyle='#8a94a8';ctx.lineWidth=5;const a=pos/62;for(let i=0;i<5;i++){const b=a+i*1.2566;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(b)*28,y+Math.sin(b)*28);ctx.stroke();}}
const CARCOL='#2f5d8c';
function carBack(){ // kabin içi
  ctx.save();ctx.beginPath();ctx.moveTo(110,1262);ctx.lineTo(220,1000);ctx.quadraticCurveTo(420,960,640,1000);ctx.lineTo(830,1262);ctx.closePath();
  ctx.fillStyle='rgba(10,20,38,.55)';ctx.fill();ctx.lineWidth=14;ctx.strokeStyle=CARCOL;ctx.stroke();ctx.restore();
  // koltuk
  ctx.fillStyle='#1d3254';rr(300,1060,70,280,22);ctx.fill();rr(330,1100,30,40,10);ctx.fill();
  ctx.fillStyle='#24406b';rr(310,1310,190,40,14);ctx.fill();
  // arka koltuk
  ctx.fillStyle='#1d3254';rr(150,1120,120,200,22);ctx.fill();
}
function dash(t,radio){ctx.fillStyle='#14233f';ctx.beginPath();ctx.moveTo(640,1262);ctx.lineTo(660,1170);ctx.lineTo(800,1190);ctx.lineTo(830,1262);ctx.closePath();ctx.fill();
  // radyo ekranı
  rr(690,1205,70,26,6);ctx.fillStyle=radio?AM:'#2a3548';if(radio)glow(AM,16);ctx.fill();noGlow();
  // direksiyon
  const [wx,wy]=CAR.wheel;ctx.strokeStyle='#0a1222';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(wx+10,wy+10);ctx.lineTo(670,1230);ctx.stroke();
  ctx.lineWidth=14;ctx.strokeStyle='#1a2235';ctx.beginPath();ctx.ellipse(wx,wy,16,58,-0.25,0,7);ctx.stroke();}
function carDoor(pos){ctx.fillStyle=CARCOL;rr(CAR.x0,1250,CAR.x1-CAR.x0,240,40);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(CAR.x0+30,1300,CAR.x1-CAR.x0-60,6);
  ctx.strokeStyle='rgba(8,17,32,.45)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(430,1262);ctx.lineTo(430,1450);ctx.stroke();
  ctx.fillStyle='#d9dfe8';rr(470,1330,50,12,6);ctx.fill();
  // farlar
  ctx.save();ctx.fillStyle='#fff1c4';glow('#fff1c4',30);rr(CAR.x1-20,1290,24,30,8);ctx.fill();ctx.restore();
  ctx.fillStyle='#b8473a';rr(CAR.x0-4,1290,20,36,6);ctx.fill();
  wheel(220,1480,pos);wheel(720,1480,pos);}
// emniyet kemeri: worn=1 takılı (çapraz), 0 sarkıyor
function belt(fig,worn,a=1){ctx.save();ctx.globalAlpha=a;ctx.lineCap='round';ctx.lineWidth=12;
  if(worn>0.5){ctx.strokeStyle=TE;glow(TE,12);ctx.beginPath();ctx.moveTo(CAR.belt,1085);ctx.lineTo(fig.sh[0]+10,fig.sh[1]+20);ctx.lineTo(CAR.hip+70,1312);ctx.stroke();}
  else{ctx.strokeStyle='#8a94a8';ctx.beginPath();ctx.moveTo(CAR.belt,1085);ctx.lineTo(CAR.belt-4,1250);ctx.stroke();ctx.fillStyle='#d9dfe8';rr(CAR.belt-16,1240,24,36,6);ctx.fill();}
  ctx.restore();}
function frontCar(xF,brake,t){if(xF>=1290)return;ctx.save();
  ctx.fillStyle='#4a5a74';rr(xF,1250,820,240,40);ctx.fill();ctx.beginPath();ctx.moveTo(xF+40,1252);ctx.lineTo(xF+130,1020);ctx.lineTo(xF+600,1020);ctx.lineTo(xF+700,1252);ctx.fill();
  ctx.fillStyle='rgba(10,20,38,.7)';ctx.beginPath();ctx.moveTo(xF+70,1240);ctx.lineTo(xF+145,1045);ctx.lineTo(xF+580,1045);ctx.lineTo(xF+660,1240);ctx.fill();
  wheel(xF+180,1480,0);
  // stop lambaları
  const on=brake>0;ctx.fillStyle=on?RED:'#6a2a2a';if(on)glow(RED,40+30*Math.abs(Math.sin(t*6)));rr(xF-6,1280,26,52,8);ctx.fill();rr(xF+110,1030,40,10,4);ctx.fill();noGlow();
  if(on){const g=ctx.createRadialGradient(xF,1300,10,xF,1300,420);g.addColorStop(0,`rgba(255,40,40,${0.35*brake})`);g.addColorStop(1,'rgba(255,40,40,0)');ctx.fillStyle=g;ctx.fillRect(xF-420,880,840,840);}
  ctx.restore();}
// SEN arabada. o: {phone:0..1, look:0..1, happy, eyes, belt, lean, shake, wave}
function senCar(t,o={}){const ph=o.phone||0, jit=(o.shake||0)*Math.sin(t*55)*3;
  const wheelArm={ua2:70,fa2:100};
  let ua=lerp(70,28,ph),fa=lerp(100,140,ph);
  if(o.wave){ua=lerp(ua,110,o.wave);fa=lerp(fa,175+Math.sin(t*12)*12*o.wave,o.wave);}
  if(o.grip){ua=lerp(ua,68,o.grip);fa=lerp(fa,96,o.grip);}
  const f=sen({x:CAR.hip+jit,y:1322,...POSE.sit,lean:(o.lean??-2),...wheelArm,ua:ua+jit,fa:fa-jit,ua2:70+jit,fa2:100+jit,look:(o.look||0)*8,nodY:(o.look||0)*4,eyes:o.eyes||'open'});
  if(o.happy){happyEyes(f,1,1,CO);mouth(f,1,1,0.9);}else if(o.open){openMouth(f,1,1,0.8);}else mouth(f,1,1,o.mouth??0.6);
  return f;}
function carScene(t,o={}){const pos=roadPos(t);const sh=o.shake||0;
  ctx.save();if(sh>0)ctx.translate(Math.sin(t*70)*10*sh,Math.cos(t*63)*6*sh);
  if(o.zoom)cam(o.zoom[0],o.zoom[1],o.zoom[2]);else cam(1.05,500,1240);
  outside(t,pos);
  if(o.front!==undefined)frontCar(o.front,o.brake||0,t);
  carBack();
  const f=senCar(t,o);
  belt(f,o.belt?1:0);
  dash(t,o.radio);
  if(o.phone>0.5&&o.phoneVis!==0){phone(f.hand[0]+6,f.hand[1]-18,{lit:true,color:o.ping?AM:TE,buzz:o.ping||0,rot:-0.2,t});}
  carDoor(pos);
  if(o.after)o.after(f);
  ctx.restore();
  return f;}

// ---------- GRAFİK ----------
function chart(t){room();fade(0.35,'5,10,20');
  const a=sm(30.15,30.6,t);if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  card(540,960,860,940,{stroke:AM});
  ctx.save();ctx.font='800 40px Inter';ctx.letterSpacing='5px';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=AM;glow(AM,16);ctx.fillText(L('KİLOMETRE BAŞINA RİSK','RISK PER MILE'),540,560);ctx.restore();
  const base=1290;ctx.strokeStyle=hexA(CR,0.5);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(160,base);ctx.lineTo(920,base);ctx.stroke();
  // UÇAK çubuğu: küçücük
  const hp=26*sm(30.7,31.2,t);ctx.fillStyle=TE;glow(TE,20);rr(250,base-hp-2,180,hp+2,8);ctx.fill();noGlow();
  planeIcon(340,base-hp-80,0.9,TE,-0.15);
  txt(L('UÇAK','PLANE'),340,base+50,40,TE,'center',800);
  // ARABA çubuğu: kocaman
  const hc=480*sm(32.0,32.9,t);ctx.fillStyle=CO;glow(CO,30);rr(650,base-hc-2,180,hc+2,8);ctx.fill();noGlow();
  carIcon(740,base-hc-50,0.95,CO);
  if(hc>40){const sx=740,sy=base-hc-100;tag('SEN',sx,sy-30,CO,sm(32.5,32.9,t));}
  txt(L('ARABA','CAR'),740,base+50,40,CO,'center',800);
  // "kat kat" oku
  const ka=sm(32.45,32.8,t);if(ka>0){ctx.save();ctx.globalAlpha=a*ka;ctx.strokeStyle=AM;ctx.lineWidth=6;ctx.lineCap='round';glow(AM,14);
    ctx.beginPath();ctx.moveTo(450,base-60);ctx.quadraticCurveTo(540,base-420,620,base-500);ctx.stroke();ctx.beginPath();ctx.moveTo(620,base-500);ctx.lineTo(590,base-494);ctx.moveTo(620,base-500);ctx.lineTo(612,base-470);ctx.stroke();
    ctx.restore();ctx.save();ctx.globalAlpha=a*ka;txt(L('KAT KAT','WAY MORE'),470,base-330,44,AM,'center',800);ctx.restore();}
  ctx.restore();}

// ---------- HABER ----------
function tv(x,y,w,h,a,t,kind){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;const k=0.8+0.2*sm(0,1,a);ctx.translate(x,y);ctx.scale(k,k);
  rr(-w/2-14,-h/2-14,w+28,h+28,18);ctx.fillStyle='#0a1222';glow('rgba(0,0,0,.6)',30);ctx.fill();noGlow();
  ctx.save();rr(-w/2,-h/2,w,h,10);ctx.clip();const g=ctx.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'#24406b');g.addColorStop(1,'#16294a');ctx.fillStyle=g;ctx.fillRect(-w/2,-h/2,w,h);
  planeIcon(Math.sin(t*1.5)*10,-h*0.08,w/420,'#dfe8f2',-0.2);
  ctx.fillStyle=RED;ctx.fillRect(-w/2,h/2-h*0.24,w,h*0.24);ctx.font=`800 ${Math.round(h*0.12)}px Inter`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.letterSpacing='2px';
  ctx.fillText(L('SON DAKİKA','BREAKING NEWS'),-w/2+16,h/2-h*0.12);ctx.restore();
  if(kind==='tv'){ctx.fillStyle='#0a1222';ctx.fillRect(-20,h/2+14,40,40);ctx.fillRect(-90,h/2+50,180,12);}
  ctx.restore();}
function news(t){room();fade(0.3,'5,10,20');
  tv(540,770,600,360,sm(33.95,34.35,t),t,'tv');
  tag(L('NADİR','RARE'),540,520,TE,sm(34.7,35.0,t));
  tv(230,1290,260,170,sm(35.6,35.85,t),t+1,'s');tv(850,1290,260,170,sm(35.8,36.05,t),t+2,'s');
  // SEN ortada, şaşkın bakıyor
  const f=sen({x:560,y:STAND_Y,...POSE.stand,ua:14,fa:30,eyes:'wide',facing:1});mouth(f,1,1,-0.4);
}

// ---------- HER GÜN ----------
function everyday(t){room();fade(0.3,'5,10,20');
  const days=L(['PZT','SAL','ÇAR','PER','CUM','CMT','PAZ'],['MON','TUE','WED','THU','FRI','SAT','SUN']);
  days.forEach((d,i)=>{const a=sm(37.05+i*0.17,37.35+i*0.17,t);if(a<=0)return;const x=135+i*135,y=760;ctx.save();ctx.globalAlpha=a;
    rr(x-58,y-90,116,180,16);ctx.fillStyle='rgba(16,30,54,.96)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=hexA(CR,0.5);ctx.stroke();
    txt(d,x,y-60,26,CR,'center',800);carIcon(x,y+20,0.62,CO);ctx.restore();});
  stamp(L('SIRADAN','ORDINARY'),540,915,TE,sm(38.55,38.9,t),-0.06,60);

  const sh=sm(39.75,40.1,t);

  if(sh>0.5){happyEyes(f,1,1,CO);mouth(f,1,1,0.9);}else mouth(f,1,1,0.5);
}

// ================= SAHNELER =================
function sHook(t){
  if(t<2.55){ // uçakta: titriyor, gözler kapalı, terliyor
    ctx.save();cam(1.35,470,1180);cabin(t,{climb:0.6,cloud:t*120});armrest();
    const f=senSeat(t,{shake:1,eyes:'tired'});lapBelt(f);sweat(f,t);ctx.restore();
    shakeMarks(560,1290,t,sm(0.5,0.9,t));
    tag(L('UÇAK','PLANE'),540,470,TE,sm(0.3,0.7,t));
  } else { // arabada: rahat, telefon
    carScene(t,{phone:1,happy:true,radio:true,zoom:[1.3,470,1200]});
    tag(L('ARABA','CAR'),540,470,CO,sm(2.6,3.0,t));
    qmark(700,760,sm(4.1,4.4,t),t,120);
  }
}
function sGate(t){gate(t);
  const u=clamp((t-5.15)/1.4),p=(t-5.15)*8.5;const f=sen({x:lerp(140,620,u),y:STAND_Y-walkBob(p),...walk(p),eyes:'wide'});mouth(f,1,1,-0.5);
  tag(L('HAVALİMANI','AIRPORT'),540,350,AM,sm(5.3,5.6,t));}
function sCabin(t){
  const tilt=-0.07*sm(11.25,12.2,t)*(1-sm(14.6,15.6,t));
  const climb=sm(11.25,13.5,t);
  const bump=sm(17.95,18.1,t)*(1-sm(19.0,19.3,t));
  ctx.save();ctx.translate(540,1150);ctx.rotate(tilt+bump*Math.sin(t*40)*0.012);ctx.translate(-540,-1150);
  if(bump>0)ctx.translate(Math.sin(t*50)*8*bump,Math.cos(t*43)*10*bump);
  const z=lerp(1.15,1.3,sm(6.4,10.7,t));
  ctx.save();cam(z,520,1170);
  cabin(t,{climb,cloud:t*(60+300*climb)});armrest();
  // hostes 14.9–17.6
  let hp=null;
  if(t>14.7&&t<17.9){const u=clamp((t-14.7)/0.7),ph=(t-14.7)*9;const x=lerp(1150,830,u);
    hp=hostess(x,STAND_Y-(u<1?walkBob(ph):0),{pose:u<1?walk(ph):{...POSE.stand,ua:30,fa:70},smile:t>15.4,label:sm(15.0,15.3,t)*(1-sm(17.4,17.8,t))},t);}
  const relax=sm(16.2,16.6,t)*(1-sm(17.9,18.1,t));
  const pray=sm(19.2,19.6,t);
  const eyes=(t>12.65&&t<16.2)||t>18.0?'tired':'wide';
  const f=senSeat(t,{shake:(t>6.4&&t<16.2)||t>18?1:0.15,eyes,relax,pray,happy:relax>0.5,lean:2+pray*6,mouth:-0.6});
  const beltA=1, bg=sm(9.15,9.4,t)*(1-sm(10.2,10.6,t));lapBelt(f,beltA,bg);
  if(t>7.9)sweat(f,t,sm(7.9,8.3,t)*(1-relax));
  if(t>12.4&&t<16.2||t>18)shakeMarks(f.hand[0],f.hand[1],t,0.8);
  ctx.restore();
  ctx.restore();
  tag(L('KEMER','SEATBELT'),540,1560,TE,bg);
  if(t>19.2)bubble(640,760,L('Ya Rabbi...','Please, please...'),sm(19.4,19.7,t),'#16294a');
  tag(L('KALKIŞ','TAKEOFF'),540,470,AM,sm(11.0,11.4,t)*(1-sm(14.4,14.7,t)));
}
function sLand(t){exitHall(t);
  const u=clamp((t-20.6)/1.3),p=(t-20.6)*8;const stretch=sm(21.1,21.4,t);
  const pose=blend(walk(p),{...POSE.shrug,ua:150,fa:178},stretch*0.8);
  const f=sen({x:lerp(240,520,u),y:STAND_Y-walkBob(p)*(1-stretch),...pose});happyEyes(f,1,1,CO);mouth(f,1,1,1);
  bubble(f.head[0]+120,f.head[1]-130,L('Oh be!','Phew!'),sm(21.2,21.4,t),'#16294a');}
function sDrive(t){
  const wave=sm(23.55,23.85,t)*(1-sm(24.7,25.0,t));
  const ph=sm(25.6,26.1,t);
  const radio=t>26.6;
  const z=t>28.6?lerp(1.05,1.0,sm(28.6,29.4,t)):1.05;
  const f=carScene(t,{phone:ph,wave,radio,happy:t>23.9,zoom:[z,500,1240],after:(f)=>{
    // radyo notaları
    if(radio)for(let i=0;i<4;i++){const u=((t-26.6)*0.7+i*0.25)%1;note(720-u*160+Math.sin(u*9+i)*12,1190-u*260,Math.sin(u*Math.PI)*(t<30?1:0));}
  }});
  // kemer takılmadı: etiketi üstü çizili
  tag(L('KEMER','SEATBELT'),540,800,RED,sm(22.85,23.1,t)*(1-sm(25.2,25.5,t)),sm(23.6,24.0,t));
  tag(L('RADYO','RADIO'),540,800,AM,sm(26.7,27.0,t)*(1-sm(28.4,28.7,t)));
  // gaz: hız çizgileri
  const g=sm(28.7,29.0,t);if(g>0){ctx.save();ctx.globalAlpha=g*0.7;ctx.strokeStyle=CR;ctx.lineWidth=4;for(let i=0;i<9;i++){const y=900+i*90,x=((t*2600+i*370)%1500)-200;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-260,y);ctx.stroke();}ctx.restore();
    tag(L('GAZ','GAS'),540,800,CO,g);}
}
function sBrake(t){
  // 41.6 bildirim, 43.3 bakar, 44.3 öndeki araba, 45.1 fren lambaları, 46.45 fren, 47.95 durur, 48.65 eller titrer
  const ping=t>41.7&&t<42.6?1:0;
  const look=sm(43.2,43.5,t)*(1-sm(46.3,46.5,t));
  const xF=t<44.3?1300:(t<45.3?lerp(1300,1080,sm(44.3,45.0,t)):lerp(1080,915,1-Math.pow(1-clamp((t-45.3)/2.65),2.2)));
  const brake=sm(45.05,45.2,t);
  const hard=sm(46.4,46.55,t)*(1-sm(47.6,48.0,t));
  const lean=-2+16*sm(46.45,46.7,t)*(1-sm(47.95,48.6,t));
  const hands=sm(48.5,49.2,t);
  const zoom=[lerp(0.86,1.9,hands),lerp(640,520,hands),lerp(1250,1190,hands)];
  const phoneOn=t<46.5;
  const f=carScene(t,{phone:phoneOn?1:lerp(1,0,sm(46.5,46.8,t)),phoneVis:phoneOn?1:0,ping,look,front:xF,brake,shake:hard,lean,eyes:t>46.4?'wide':'open',open:t>46.4&&t<48,mouth:t>48?-0.6:0.6,grip:sm(46.5,46.8,t),zoom,
    after:(f)=>{
      // telefon elden fırlar
      if(t>46.5&&t<47.6){const u=(t-46.5)/1.1;phone(lerp(f.hand[0]+6,780,u),lerp(f.hand[1]-18,1240,u)-Math.sin(u*Math.PI)*120,{lit:true,color:TE,rot:u*8,t});}
      if(t>48.6){shakeMarks(CAR.wheel[0],CAR.wheel[1]+20,t,hands*0.9,CO);sweat(f,t,hands);}
    }});
  notif(540,560,L('Bildirim','Notification'),L('Yeni mesajın var','You have a new message'),sm(41.7,42.0,t)*(1-sm(43.6,43.9,t)));
  tag(L('FREN LAMBALARI','BRAKE LIGHTS'),540,800,RED,sm(45.15,45.4,t)*(1-sm(46.3,46.5,t)));
  if(hard>0){fade(0.35*hard*(0.5+0.5*Math.sin(t*30)),'255,40,40');}
}

// ================= ALTYAZILAR =================
function caps(t){
  caption(L([[['Uçağa binerken',W1]],[['elin ',W1],['titriyor.',TE]]],[[['Your hands shake',W1]],[['boarding a ',W1],['plane.',TE]]]),0.3,2.55,t);
  caption(L([[['Arabaya binerken...',W1]],[['hiç ',W1],['düşündün mü?',CO]]],[[['Getting in a car...',W1]],[['ever ',W1],['think twice?',CO]]]),2.5,5.1,t);
  caption(L([[['Havalimanı.',AM]]],[[['The airport.',AM]]]),5.25,6.45,t);
  caption(L([[['Koltuğa ',W1],['yapıştın,',CO]],[['avuçların terli.',W1]]],[[['Glued to your ',W1],['seat,',CO]],[['palms sweaty.',W1]]]),6.4,9.1,t);
  caption(L([[['Kemer',TE],[' çoktan takılı.',W1]]],[[['Seatbelt',TE],['\'s already on.',W1]]]),9.05,10.75,t);
  caption(L([[['Uçak ',W1],['kalkıyor.',AM]]],[[['Takeoff.',AM]]]),10.85,12.6,t);
  caption(L([[['Gözler kapalı,',W1]],[['eller ',W1],['koltukta.',CO]]],[[['Eyes shut,',W1]],[['gripping the ',W1],['seat.',CO]]]),12.55,14.8,t);
  caption(L([[['Hostes ',W1],['gülümsese,',TE]],[['rahatlıyorsun.',W1]]],[[['The attendant ',W1],['smiles,',TE]],[['you relax.',W1]]]),14.9,17.5,t);
  caption(L([[['Ufak bir ',W1],['sarsıntı',AM],[' olsa...',W1]]],[[['One little ',W1],['bump...',AM]]]),17.45,19.25,t);
  caption(L([[['duaya',CO],[' başlıyorsun.',W1]]],[[['you start ',W1],['praying.',CO]]]),19.2,20.5,t);
  caption(L([[['İndin, ',W1],['oh be.',TE]]],[[['You land. ',W1],['Phew.',TE]]]),20.65,21.8,t);
  caption(L([[['Arabaya bindin.',W1]]],[[['You get in the car.',W1]]]),21.75,22.85,t);
  caption(L([[['Kemer?',RED]]],[[['Seatbelt?',RED]]]),22.8,23.65,t,74);
  caption(L([[['Boş ver, ',W1],['yakın zaten.',AM]]],[[['Nah, ',W1],['it\'s close.',AM]]]),23.6,25.3,t);
  caption(L([[['Bir elde ',W1],['telefon,',CO]],[['radyo sonuna kadar açık.',W1]]],[[['Phone',CO],[' in one hand,',W1]],[['radio cranked up.',W1]]]),25.4,28.65,t);
  caption(L([[['Gaza bastın.',CO]]],[[['Foot on the gas.',CO]]]),28.6,30.1,t,70);
  caption(L([[['Halbuki ',W1],['kaza riski...',AM]]],[[['But the ',W1],['crash risk...',AM]]]),30.25,32.0,t);
  caption(L([[['arabada ',CO],['kat kat',AM]],[['daha fazla.',W1]]],[[['is ',W1],['way higher',AM]],[['in the ',W1],['car.',CO]]]),31.95,33.8,t);
  caption(L([[['Korktuğun şey ',W1],['nadir,',TE]],[['ama ',W1],['haberlere',RED],[' çıkıyor.',W1]]],[[['What you fear is ',W1],['rare,',TE]],[['but it makes ',W1],['the news.',RED]]]),33.9,36.85,t);
  caption(L([[['Her gün yaptığın şey...',W1]],[['sıradan.',TE]]],[[['What you do every day...',W1]],[['is ',W1],['ordinary.',TE]]]),36.95,39.7,t);
  caption(L([[['O yüzden ',W1],['korkmuyorsun.',AM]]],[[['So you ',W1],['don\'t fear it.',AM]]]),39.65,41.45,t);
  caption(L([[['Telefona ',W1],['bildirim',AM],[' geldi.',W1]]],[[['Your phone ',W1],['pings.',AM]]]),41.6,43.25,t);
  caption(L([[['Baktın.',AM]]],[[['You look.',AM]]]),43.2,44.25,t,74);
  caption(L([[['Önünde...',W1]],[['fren lambaları.',RED]]],[[['Up ahead...',W1]],[['brake lights.',RED]]]),44.2,46.2,t);
  caption(L([[['Frene ',W1],['asıldın.',RED]]],[[['You ',W1],['slam the brakes.',RED]]]),46.25,47.45,t,70);
  caption(L([[['Son anda ',W1],['durdun.',AM]]],[[['Stop ',W1],['just in time.',AM]]]),47.4,48.6,t,70);
  caption(L([[['Ellerin ',W1],['titriyor...',CO]],[['bu sefer ',W1],['arabada.',CO]]],[[['Hands ',W1],['shaking...',CO]],[['this time, ',W1],['in the car.',CO]]]),48.55,51.3,t);
}

function scene(t){
  ctx.fillStyle='#070e1a';ctx.fillRect(0,0,W,H);
  if(t<5.15) sHook(t);
  else if(t<6.4) sGate(t);
  else if(t<20.5) sCabin(t);
  else if(t<21.75) sLand(t);
  else if(t<30.1) sDrive(t);
  else if(t<33.82) chart(t);
  else if(t<36.88) news(t);
  else if(t<41.5) everyday(t);
  else sBrake(t);
  for(const c of [2.55,5.15,6.4,20.5,21.75,30.1,33.82,36.88,41.5]) fade(0.92*(1-clamp(Math.abs(t-c)/0.2)),'5,10,20');
  if(t<51.4) caps(t);
  // final
  fade(0.95*sm(51.2,51.7,t),'5,10,20');
  if(t>51.3){
    caption(L([[['Bugün arabaya binince...',W1]]],[[['Today, when you get',W1]],[['in the car...',W1]]]),51.6,DURATION+1,t,64,560);
    caption(L([[['önce ',W1],['kemeri tak.',TE]]],[[['buckle up ',TE],['first.',W1]]]),53.45,DURATION+1,t,84,800);
    caption(L([[['Telefonu',AM]],[['arka koltuğa at.',AM]]],[[['Toss your phone',AM]],[['in the back seat.',AM]]]),54.95,DURATION+1,t,84,1010);
    // kemer tokası "tık"
    const b=sm(53.8,54.15,t);if(b>0){ctx.save();ctx.globalAlpha=b;const x=540,y=1250;ctx.fillStyle='#8a94a8';rr(x-110+40*(1-b),y-14,90,28,8);ctx.fill();ctx.fillStyle=TE;glow(TE,20);rr(x+10,y-18,70,36,8);ctx.fill();ctx.restore();}
  }
  endCard(t,56.8);
}
K.run(DURATION, scene);
