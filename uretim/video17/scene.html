<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../kit/engine.js"></script>
<script>
// 17 — Logo farkı. Satır başlangıçları (audio.py VO ile AYNI):
// l01 0.3 | l02 5.9 | l03 10.2 | l04 14.1 | l05 18.9 | l06 24.9 | l07 29.4 | l08 33.9 | l09 39.4 | l10 44.3 | l11 48.7 | l12 52.0
const DURATION = 60.5;
const AM=C.amber, CO=C.coral, TE=C.teal, CR=C.cream, WH='#fff';
const CLOTH='#8ea3c4';
const P_PLAIN=L('150 TL','$15'), P_STAR=L('1.500 TL','$150');

// ---------- yardımcılar ----------
function star(x,y,r,col=AM,a=1,rot=0){if(a<=0||r<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
  for(let i=0;i<10;i++){const rr_=i%2?r*0.45:r;const an=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(an)*rr_,Math.sin(an)*rr_);}
  ctx.closePath();ctx.fillStyle=col;glow(col,r*0.9);ctx.fill();noGlow();ctx.restore();}
// tişört: (x,y) merkez, s = yarım genişlik
function tshirt(x,y,s,{col=CLOTH,starA=0,alpha=1,rot=0,starR=0.22}={}){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.beginPath();ctx.moveTo(-0.25,-1);ctx.lineTo(-0.58,-0.93);ctx.lineTo(-1,-0.55);ctx.lineTo(-0.8,-0.25);ctx.lineTo(-0.6,-0.4);ctx.lineTo(-0.6,1);ctx.lineTo(0.6,1);
  ctx.lineTo(0.6,-0.4);ctx.lineTo(0.8,-0.25);ctx.lineTo(1,-0.55);ctx.lineTo(0.58,-0.93);ctx.lineTo(0.25,-1);ctx.quadraticCurveTo(0,-0.72,-0.25,-1);ctx.closePath();
  ctx.fillStyle=col;glow('rgba(0,0,0,.45)',0.25*s);ctx.fill();noGlow();
  ctx.lineWidth=0.025;ctx.strokeStyle=shade(col,-0.3);ctx.beginPath();ctx.moveTo(-0.6,0.86);ctx.lineTo(0.6,0.86);ctx.stroke();
  ctx.restore();
  if(starA>0){ctx.save();ctx.globalAlpha*=alpha;const sc=1+0.6*Math.max(0,1-starA)*0;star(x+s*0.28*Math.cos(rot),y-s*0.42,s*starR*sc,AM,starA);ctx.restore();}}
function hanger(x,y,s){ctx.save();ctx.strokeStyle='#5d7398';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y-s*1.08,12,Math.PI,0.2*Math.PI);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-s*0.62,y-s*0.9);ctx.lineTo(x,y-s*1.05);ctx.lineTo(x+s*0.62,y-s*0.9);ctx.stroke();ctx.restore();}
function priceTag(x,y,text,{col=CR,sc=1,a=1}={}){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.font='800 44px Inter';const w=ctx.measureText(text).width+60;
  rr(-w/2,-36,w,72,14);ctx.fillStyle=col;glow(hexA(col,0.6),18);ctx.fill();noGlow();
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(-w/2+18,0,6,0,7);ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,10,3);ctx.restore();}
function mover(t,t0,t1,x0,x1){const u=clamp((t-t0)/(t1-t0));return {x:lerp(x0,x1,u),walking:t>t0&&t<t1,p:(t-t0)*8.5};}
function chest(f,x,y,s=1){return [lerp(x,f.sh[0],0.62),lerp(y,f.sh[1],0.62)];}
// SEN: göğsünde yıldız (starA)
function sen(o){const f=figure({color:CO,...o});const s=o.s||1;
  if(o.starA>0){const c=chest(f,o.x,o.y,s);star(c[0]+6*(o.facing||1)*s,c[1],(16+(o.starBoost||0))*s,AM,o.starA);}
  tag('SEN',f.head[0],f.head[1]-92*s,CO);return f;}

// ---------- SAHNE: İKİ TİŞÖRT (kanca + l11) ----------
function sPair(t,{hook=true}={}){
  room();
  // ray
  ctx.strokeStyle='#3a5580';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(140,590);ctx.lineTo(940,590);ctx.stroke();
  const LX=320,RX=760,SY=770,SS=150;
  const sway=Math.sin(t*1.6)*0.02;
  hanger(LX,SY,SS);hanger(RX,SY,SS);
  const STAR_T=hook?5.15:0;const sa=hook?sm(STAR_T,STAR_T+0.15,t):1;
  tshirt(LX,SY,SS,{rot:sway});tshirt(RX,SY,SS,{rot:-sway,starA:sa,starR:0.2+(hook?0.25*(1-sm(STAR_T+0.15,STAR_T+0.6,t))*sa:0)});
  if(hook){
    const c1=sm(0.4,0.7,t),c2=sm(1.35,1.65,t);
    tag(L('AYNI FABRİKA','SAME FACTORY'),540,460,CR,c1*(1-sm(4.9,5.2,t)));
    tag(L('AYNI KUMAŞ','SAME FABRIC'),540,520,CR,c2*(1-sm(4.9,5.2,t)));
    // flaş
    if(t>STAR_T&&t<STAR_T+0.5){ctx.save();ctx.globalAlpha=(1-(t-STAR_T)/0.5)*0.5;const g=ctx.createRadialGradient(RX+42,SY-63,5,RX+42,SY-63,260);
      g.addColorStop(0,hexA(AM,0.9));g.addColorStop(1,hexA(AM,0));ctx.fillStyle=g;ctx.fillRect(RX-300,SY-330,600,600);ctx.restore();}
  }
  const pa=hook?sm(5.25,5.5,t):1;
  priceTag(LX,1000,P_PLAIN,{col:TE,a:pa});
  const big=hook?1:1+0.25*sm(50.3,50.6,t);
  priceTag(RX,1000,P_STAR,{col:AM,a:pa,sc:big});
  // SEN ortada
  let o={...POSE.stand,ua:10,fa:18},facing=1,eyes='open';
  if(hook){facing=t<1.2?-1:(t<2.5?1:-1);const sh=sm(2.6,2.9,t)*(1-sm(3.7,4.0,t));o=blend(o,POSE.shrug,sh);if(t>5.2)eyes='wide';if(t>5.2)facing=1;}
  else {facing=1;const lk=sm(49.3,49.6,t);o=blend(o,{...POSE.think},0.0);o=blend(o,POSE.sad,sm(50.8,51.3,t));eyes=t>50.4?'tired':'open';if(t<49.4)facing=-1;}
  sen({x:540,y:STAND_Y,...o,facing,eyes,starA:hook?0:1,starBoost:hook?0:14*Math.max(0,Math.sin(clamp((t-50.3)/0.8)*Math.PI))});
}
function capHook(t){
  caption(L([[['Aynı',AM],[' fabrika,',WH]],[['aynı',AM],[' kumaş.',WH]]],[[['Same',AM],[' factory,',WH]],[['same',AM],[' fabric.',WH]]]),0.2,2.35,t,74);
  caption(L([[['Sence ',WH],['fark ne?',CO]]],[[["So what's the ",WH],['difference?',CO]]]),2.35,3.8,t,74);
  caption(L([[['Sadece...',WH]],[['bir ',WH],['logo.',AM]]],[[['Just...',WH]],[['a ',WH],['logo.',AM]]]),3.8,5.75,t,80);
}

// ---------- SAHNE: FABRİKA ----------
const BELT_Y=1160,X0=330,BV=180,STAMP_X=600,END_X=760,BA=840,BB=995;
const ti=i=>i-2.6;
function factoryBG(dim=0){
  room();
  // yüksek pencereler
  for(let i=0;i<4;i++){ctx.save();rr(90+i*240,470,170,230,8);ctx.fillStyle=hexA('#1d3a66',1-dim*0.5);ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=4;ctx.stroke();
    ctx.beginPath();ctx.moveTo(175+i*240,470);ctx.lineTo(175+i*240,700);ctx.moveTo(90+i*240,585);ctx.lineTo(260+i*240,585);ctx.stroke();ctx.restore();}
  // borular
  ctx.strokeStyle='#22385c';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(0,420);ctx.lineTo(W,420);ctx.stroke();
}
function belt(t){
  ctx.fillStyle='#1f3558';rr(40,BELT_Y,END_X-40,34,14);ctx.fill();
  ctx.fillStyle='#2c4772';for(let x=60;x<END_X;x+=60){const off=(t*BV)%60;ctx.fillRect(x+off-60>40?x+off-60:x,BELT_Y+6,26,6);}
  ctx.fillStyle='#16294a';[80,END_X-40].forEach(x=>{ctx.fillRect(x-8,BELT_Y+34,16,FLOOR-BELT_Y-34);});
  ctx.fillStyle='#2c4772';for(let x=70;x<END_X;x+=90){ctx.beginPath();ctx.arc(x,BELT_Y+24,9,0,7);ctx.fill();}
}
function machine(x,t,on=1){ctx.save();ctx.fillStyle='#24406b';rr(x-60,BELT_Y-150,120,110,14);ctx.fill();ctx.fillRect(x+30,BELT_Y-40,20,40);
  const n=Math.sin(t*28)*8*on;ctx.strokeStyle=CR;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+40,BELT_Y-40);ctx.lineTo(x+40,BELT_Y-20+n);ctx.stroke();
  ctx.fillStyle=hexA(TE,0.6+0.3*on);glow(TE,16);ctx.beginPath();ctx.arc(x-25,BELT_Y-115,8,0,7);ctx.fill();noGlow();ctx.restore();}
function worker(x,t,{s=1,sad=0,alpha=1}={}){const k=Math.sin(t*9);
  let o={...POSE.stand,lean:10,ua:70+k*10,fa:95-k*12,ua2:60-k*8,fa2:100+k*10};o=blend(o,{...o,nodY:10,lean:16},sad);
  return figure({x,y:standY(s),s,color:CR,...o,facing:1,eyes:sad>0.5?'tired':'open',alpha});}
function press(t,on){if(on<=0)return;let down=0;for(let i=17;i<=25;i+=2){const ts=ti(i)+(STAMP_X-X0)/BV;down=Math.max(down,1-Math.abs(t-ts)/0.22);}
  ctx.save();ctx.globalAlpha=on;ctx.fillStyle='#2c4772';ctx.fillRect(STAMP_X-10,420,20,560+down*20);
  rr(STAMP_X-60,960+down*30,120,50,10);ctx.fillStyle='#35527f';ctx.fill();ctx.fillStyle=AM;glow(AM,10+down*30);ctx.fillRect(STAMP_X-40,1006+down*30,80,8);noGlow();ctx.restore();
  tag(L('LOGO','LOGO'),STAMP_X,930,AM,on);}
function basket(x,label,col,n,starred,a,ty=1450){if(a<=0)return;ctx.save();ctx.globalAlpha=a;
  for(let k=0;k<Math.min(n,4);k++)tshirt(x,1290-k*14,52,{starA:starred?1:0,rot:(k%2?0.08:-0.06)});
  ctx.fillStyle='#24406b';ctx.beginPath();ctx.moveTo(x-75,1290);ctx.lineTo(x+75,1290);ctx.lineTo(x+60,1400);ctx.lineTo(x-60,1400);ctx.closePath();ctx.fill();
  ctx.strokeStyle=hexA(col,0.7);ctx.lineWidth=3;ctx.stroke();ctx.restore();tag(label,Math.min(x,1080-label.length*13-30),ty,col,a);}
function sFactory(t){
  factoryBG();
  const w=worker(140,t);machine(250,t);
  tag(L('İŞÇİ','WORKER'),w.head[0],w.head[1]-92,CR,sm(11.9,12.3,t));
  const split=sm(14.85,15.2,t);
  press(t,split);
  belt(t);
  let nA=0,nB=0;
  for(let i=0;i<30;i++){const t0=ti(i);if(t<t0)continue;const dt=t-t0;let x=X0+dt*BV,y=BELT_Y-55;
    const sorted=i>=17, toB=sorted&&i%2===1;const stamped=toB&&t>=t0+(STAMP_X-X0)/BV;
    const tEnd=t0+(END_X-X0)/BV;let a=clamp(dt/0.3);
    if(t>tEnd){const u=clamp((t-tEnd)/0.5);const tx=toB?BB:BA;x=lerp(END_X,tx,u);y=lerp(BELT_Y-55,1270,u)-Math.sin(u*Math.PI)*(toB?160:60);
      if(u>=1){if(toB)nB++;else nA++;continue;}}
    if(x<-100)continue;
    tshirt(x,y,52,{starA:stamped?1:0,starR:stamped?0.22+0.3*(1-clamp((t-(t0+(STAMP_X-X0)/BV))/0.3)):0,alpha:a});}
  if(split<0.05){/* tek kutu */}
  basket(BA,L('DÜZ','PLAIN'),TE,nA>0?Math.max(2,nA):2,false,1);
  basket(BB,L('YILDIZLI','STAR'),AM,nB,true,split,1500);
  tag(L('FABRİKA','FACTORY'),540,1530,TE,sm(5.9,6.4,t));
  caption(L([[['Fabrikada ',WH],['bant',AM],[' dönüyor.',WH]]],[[['The factory ',WH],['line',AM],[' is rolling.',WH]]]),5.9,7.5,t,70);
  caption(L([[['Tişörtler bir bir akıyor,',WH]],[['hepsi aynı.',AM]]],[[['Shirt after shirt,',WH]],[['all the same.',AM]]]),7.5,10.05,t,66);
  caption(L([[['Aynı ',WH],['makineden',AM]],[['çıktılar.',WH]]],[[['Same ',WH],['machine.',AM]]]),10.2,11.9,t,72);
  caption(L([[['Aynı ',WH],['işçinin',AM]],[['elinden geçtiler.',WH]]],[[["Same ",WH],["worker's",AM],[' hands.',WH]]]),11.9,13.9,t,72);
  caption(L([[['Bandın sonunda',WH]],[['ikiye',AM],[' ayırdılar.',WH]]],[[['At the end of the line,',WH]],[['they split them ',WH],['in two.',AM]]]),14.1,16.2,t,68);
  caption(L([[['Bir tanesine küçücük',WH]],[['bir ',WH],['yıldız',AM],[' bastılar.',WH]]],[[['On one, they stamp',WH]],[['a tiny ',WH],['star.',AM]]]),16.2,18.75,t,68);
}

// ---------- SAHNE: VİTRİN ----------
function sStore(t){
  room();
  // vitrin
  ctx.save();rr(80,520,920,720,18);ctx.fillStyle='#10233f';ctx.fill();ctx.lineWidth=10;ctx.strokeStyle='#2c4772';ctx.stroke();ctx.restore();
  ctx.save();ctx.globalAlpha=0.08;ctx.fillStyle=WH;ctx.beginPath();ctx.moveTo(140,540);ctx.lineTo(300,540);ctx.lineTo(160,1220);ctx.lineTo(100,1220);ctx.closePath();ctx.fill();ctx.restore();
  lampCone(330,520,360,420,0.7);lampCone(750,520,360,420,0.9);
  ctx.strokeStyle='#3a5580';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(160,600);ctx.lineTo(920,600);ctx.stroke();
  const LX=330,RX=750,SY=790,SS=140;const sway=Math.sin(t*1.4)*0.02;
  hanger(LX,SY,SS);tshirt(LX,SY,SS,{rot:sway});
  const bought=sm(27.0,27.4,t);
  hanger(RX,SY,SS);tshirt(RX,SY,SS,{rot:-sway,starA:1,alpha:1-bought});
  priceTag(LX,1030,P_PLAIN,{col:TE,a:sm(21.2,21.5,t)});
  const grow=sm(23.6,24.3,t);
  priceTag(RX,1030,P_STAR,{col:AM,a:sm(23.5,23.8,t),sc:1+0.35*grow-0.15*sm(26.0,26.4,t)});
  // ×10
  const xa=sm(25.35,25.6,t);if(xa>0){ctx.save();ctx.globalAlpha=xa;ctx.translate(920,930);ctx.rotate(0.15);ctx.scale(1+0.3*(1-xa),1+0.3*(1-xa));
    ctx.beginPath();ctx.arc(0,0,62,0,7);ctx.fillStyle=CO;glow(CO,24);ctx.fill();noGlow();ctx.fillStyle=WH;ctx.font='800 50px Inter';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('×10',0,3);ctx.restore();}
  tag(L('MAĞAZA','STORE'),540,1470,TE,sm(19.0,19.4,t));
  // SEN
  if(t>25.9){const m=mover(t,25.9,26.9,-80,545);const walking=m.walking;
    let o=walking?walk(m.p):{...POSE.stand};let y=STAND_Y-(walking?walkBob(m.p):0);
    const joy=sm(27.3,27.6,t)*(1-sm(28.9,29.2,t));o=blend(o,{...POSE.stand,ua:150,fa:165,ua2:20,fa2:40,lean:-4},joy);
    sen({x:m.x,y,...o,facing:1,eyes:'open',starA:bought});}
  notif(540,1640,L('BANKA','BANK'),L('1.500 TL · 3 taksit onaylandı','$150 · 3 payments approved'),sm(28.3,28.6,t)*(1-sm(29.0,29.3,t)+0)*1,1);
  caption(L([[['Vitrine ',WH],['çıktılar.',AM]]],[[['Into the ',WH],['store window.',AM]]]),18.9,20.25,t,72);
  caption(L([[['Düz olan... ',WH],[P_PLAIN,TE]]],[[['The plain one... ',WH],[P_PLAIN,TE]]]),20.25,22.1,t,72);
  caption(L([[['Yıldızlı olan...',WH]],[[P_STAR,AM]]],[[['The one with the star...',WH]],[[P_STAR,AM]]]),22.1,24.75,t,72);
  caption(L([[['Fiyatı ',WH],['on katına',CO],[' çıktı.',WH]]],[[['Ten times',CO],[' the price.',WH]]]),24.9,26.5,t,70);
  caption(L([[['Sen yıldızlıyı aldın',WH]],[['tabii. Hem de ',WH],['taksitle.',CO]]],[[['And you got the star one.',WH]],[['On ',WH],['installments.',CO]]]),26.5,29.25,t,68);
}

// ---------- SAHNE: SOKAK ----------
function sStreet(t){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.bgTop);g.addColorStop(1,C.bgBot);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const off=(t-29.2)*60;
  for(let i=0;i<8;i++){const bx=((i*190-off)%1520+1520)%1520-220;const bh=380+((i*137)%5)*70;ctx.fillStyle=i%2?'#13233c':'#172a47';ctx.fillRect(bx,FLOOR-bh,170,bh);
    ctx.fillStyle=hexA(AM,0.25);for(let r=0;r<5;r++)for(let c=0;c<3;c++){if((i*7+r*3+c)%4===0)continue;ctx.fillRect(bx+22+c*48,FLOOR-bh+40+r*70,26,36);}}
  ctx.fillStyle=C.floor;ctx.fillRect(0,FLOOR,W,H-FLOOR);ctx.strokeStyle=hexA(C.line,0.55);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,FLOOR);ctx.lineTo(W,FLOOR);ctx.stroke();
  for(let i=0;i<10;i++){const x=((i*140-off*1.6)%1400+1400)%1400-160;ctx.fillStyle=hexA(C.line,0.4);ctx.fillRect(x,FLOOR+60,80,8);}
  // kalabalık
  const crowd=[{x0:1100,v:-120,s:0.82},{x0:1300,v:-100,s:0.8},{x0:150,v:0,s:0.86}];
  crowd.forEach((c,i)=>{const p=(t-29.2)*8+i;const x=c.x0+c.v*(t-29.2);if(x<-100||x>1180)return;
    figure({x,y:standY(c.s)-walkBob(p)*c.s,s:c.s,color:CR,...walk(p),facing:-1,alpha:0.75});});
  // dönen kişi
  const turn=t>31.9;const pt=sm(32.3,32.6,t);
  const fx=830;const fo=blend({...POSE.stand},POSE.point,pt);
  const f=figure({x:fx,y:standY(0.9),s:0.9,color:CR,...fo,facing:turn?-1:1,eyes:t>32.3?'wide':'open'});
  bubble(f.head[0]-20,f.head[1]-120,L('Vay, marka!','Whoa, designer!'),sm(32.4,32.7,t)*(1-sm(33.6,33.9,t)));
  // SEN
  const p=(t-29.2)*7.5;const x=lerp(260,470,clamp((t-29.2)/4.5));
  const o={...walk(p,20),lean:-9,ua:-10+8*Math.sin(p),fa:6,ua2:-10-8*Math.sin(p),fa2:6};
  sen({x,y:STAND_Y-walkBob(p),...o,facing:1,starA:1,starBoost:t>32.9&&t<33.8?6*Math.sin((t-32.9)*Math.PI/0.9):0});
  tag(L('SOKAK','STREET'),540,1530,TE,sm(29.4,29.8,t));
  caption(L([[['Sokakta göğsünü',WH]],[['gere gere',AM],[' yürüdün.',WH]]],[[['You strut down the street,',WH]],[['chest out.',AM]]]),29.4,31.65,t,70);
  caption(L([[['Biri dönüp baktı:',WH]],[['“Vay, marka!”',AM]]],[[['Someone turns:',WH]],[['“Whoa, designer!”',AM]]]),31.65,33.8,t,72);
}

// ---------- SAHNE: EV, DOLAP ----------
const CLOSET=[['#8ea3c4',0],['#c98a7a',1],['#6f8f87',2],['#a08ec4',3],['#d0b37a',4]];
function sHome(t){
  room();frame(130,800);ceilingLamp(330,0.6,1130);
  // dolap
  const X=560,Y=700,WD=440,HT=700;ctx.fillStyle='#16294a';ctx.fillRect(X,Y,WD,HT);ctx.strokeStyle='#2c4772';ctx.lineWidth=6;ctx.strokeRect(X,Y,WD,HT);
  ctx.strokeStyle='#3a5580';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(X+20,Y+70);ctx.lineTo(X+WD-20,Y+70);ctx.stroke();
  CLOSET.forEach(([col,i])=>{const cx=X+60+i*80;tshirt(cx,Y+190,62,{col,starA:1,rot:Math.sin(t*1.5+i)*0.03});});
  // alt raf: ayakkabı + çanta
  for(let i=0;i<3;i++){ctx.fillStyle='#24406b';rr(X+40+i*130,Y+HT-90,100,50,14);ctx.fill();star(X+90+i*130,Y+HT-66,12,AM,1);}
  ctx.fillStyle='#24406b';ctx.fillRect(X+20,Y+400,WD-40,10);
  for(let i=0;i<2;i++){ctx.fillStyle=i?'#7a4a3a':'#5a6f94';rr(X+70+i*180,Y+430,140,110,16);ctx.fill();star(X+140+i*180,Y+485,16,AM,1);}
  // kapaklar
  const op=sm(34.9,35.5,t);const dw=WD/2*(1-op*0.85);
  ctx.fillStyle='#1d3254';ctx.fillRect(X,Y,dw,HT);ctx.fillRect(X+WD-dw,Y,dw,HT);ctx.strokeStyle='#2c4772';ctx.lineWidth=4;ctx.strokeRect(X,Y,dw,HT);ctx.strokeRect(X+WD-dw,Y,dw,HT);
