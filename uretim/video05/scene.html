<canvas id="c" width="1080" height="1920"></canvas>
<script src="../kit/engine.js"></script>
<script>
// 05 — Annen elde yıkardı. Satır başlangıçları audio.py ile AYNI:
// l01 0.3 | l02 4.6 | l03 10.3 | l04 16.3 | l05 20.5 | l06 23.9 | l07 29.2 | l08 35.3 | l09 39.0 | l10 42.8 | l11 47.8 | l12 52.2
const DURATION = 58.5;
const RED = '#ff4d4d';
const T_STOP = 6.5;      // "durdu"
const T_GRUMBLE = L(8.7, 9.4);   // "söylenmeye" / "grumbling"
const T_ASK = 12.0;      // "servis ne zaman gelir"
const T_REPLY = 13.9;    // "cevap geldi"
const T_IKI = 14.9;      // "iki... saat"
const T_PAST_IN = 21.3, T_PAST = 22.2, T_PAST_OUT = 47.1, T_NOW = 47.6;
const T_BLOW = L(35.6, 36.1), T_RED = L(37.9, 38.2), T_YIL = 42.9, T_FINAL = 51.9;
const T_REST = L(41.3, 40.6);   // "Duymadın" / "Not once"
const T_CALL2 = L(54.25, 53.8), T_END = L(55.6, 56.1);

// ---------- yardımcılar ----------
function bigTag(text,x,y,color,alpha,sc=1){if(alpha<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);tag(text,0,0,color,alpha);ctx.restore();}
function msgCard(x,y,title,msg,a,col,icon,right=L('şimdi','now')){
  if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y+(1-a)*14);
  rr(-400,-62,800,124,26);ctx.fillStyle='rgba(16,30,54,0.96)';glow('rgba(0,0,0,.6)',30);ctx.fill();noGlow();
  ctx.lineWidth=2;ctx.strokeStyle=hexA(col,0.55);ctx.stroke();
  rr(-370,-34,68,68,16);ctx.fillStyle=col;ctx.fill();
  ctx.fillStyle=C.ink;ctx.font='800 34px Inter';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(icon,-336,2);
  ctx.textAlign='left';ctx.fillStyle=col;ctx.font='800 28px Inter';ctx.letterSpacing='3px';ctx.fillText(title,-280,-20);
  ctx.letterSpacing='0px';ctx.fillStyle='#e9eef7';ctx.font='500 32px Inter';ctx.fillText(msg,-280,22);
  ctx.fillStyle='rgba(233,238,247,.45)';ctx.font='500 24px Inter';ctx.textAlign='right';ctx.fillText(right,370,-20);
  ctx.restore();}
// kafanın yanında stres çizgileri
function stress(head,t,a,f=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=C.amber;ctx.lineWidth=6;ctx.lineCap='round';glow(C.amber,12);
  [-60,-25,10].forEach((ang,i)=>{const j=Math.sin(t*17+i*2)*6;const r0=58+j*0.3,r1=88+j;const an=rad(ang);
    const cx=head[0]-f*0, cy=head[1];
    ctx.beginPath();ctx.moveTo(cx+f*Math.cos(an)*r0,cy+Math.sin(an)*r0);ctx.lineTo(cx+f*Math.cos(an)*r1,cy+Math.sin(an)*r1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-f*Math.cos(an)*r0,cy+Math.sin(an)*r0);ctx.lineTo(cx-f*Math.cos(an)*r1,cy+Math.sin(an)*r1);ctx.stroke();});
  ctx.restore();}

// ---------- BANYO (bugün) ----------
function tiles(){ctx.save();ctx.strokeStyle=hexA(C.line,0.35);ctx.lineWidth=2;
  for(let y=700;y<FLOOR;y+=90){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let x=0;x<=W;x+=90){ctx.beginPath();ctx.moveTo(x,700);ctx.lineTo(x,FLOOR);ctx.stroke();}
  ctx.strokeStyle=hexA(C.line,0.7);ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,700);ctx.lineTo(W,700);ctx.stroke();ctx.restore();}
function washer(t,shake,err){
  const dx=Math.sin(t*55)*6*shake, dy=Math.sin(t*43)*2.5*shake;
  ctx.save();ctx.translate(dx,dy);
  const x=650,y=1050,w=270,h=350;
  rr(x,y,w,h,18);ctx.fillStyle='#1f3558';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#36588c';ctx.stroke();
  ctx.fillStyle='#172a48';ctx.fillRect(x+4,y+70,w-8,4);
  // ekran
  rr(x+24,y+18,110,38,8);ctx.fillStyle='#0a1426';ctx.fill();
  ctx.font='700 26px "DejaVu Sans Mono"';ctx.textAlign='center';ctx.textBaseline='middle';
  if(err){glow(RED,14);ctx.fillStyle=RED;ctx.fillText('E-21',x+79,y+38);}else{glow(C.teal,10);ctx.fillStyle=C.teal;ctx.fillText('0:42',x+79,y+38);}noGlow();
  // düğme + ışık
  ctx.fillStyle='#36588c';ctx.beginPath();ctx.arc(x+180,y+37,16,0,7);ctx.fill();
  const on=err?(((t*2.4)%1)<0.6):1;const lc=err?RED:C.teal;
  ctx.fillStyle=on?lc:'#3a2a30';if(on)glow(lc,err?40:16);ctx.beginPath();ctx.arc(x+235,y+37,11,0,7);ctx.fill();noGlow();
  // kapak + tambur
  const cx=x+w/2,cy=y+205;
  ctx.fillStyle='#0b1628';ctx.beginPath();ctx.arc(cx,cy,104,0,7);ctx.fill();ctx.lineWidth=12;ctx.strokeStyle='#4b6da3';ctx.stroke();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,92,0,7);ctx.clip();
  ctx.fillStyle=hexA(C.teal,0.12);ctx.fillRect(cx-100,cy-100,200,200);
  const ang=t*(shake>0?9:0)+(shake>0?0:T_STOP*9);
  [[C.coral,40],[C.cream,-30],[C.amber,60],['#7fa0d0',0]].forEach(([c,o],i)=>{const a=ang+i*1.6;
    ctx.fillStyle=hexA(c,0.75);ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*45,cy+Math.sin(a)*45+(shake>0?0:30),34,22,a,0,7);ctx.fill();});
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.ellipse(cx-35,cy-40,30,14,-0.6,0,7);ctx.fill();
  ctx.restore();
  // titreme çizgileri
  if(shake>0){ctx.save();ctx.strokeStyle=hexA(C.cream,0.5*shake);ctx.lineWidth=4;ctx.lineCap='round';
    for(let i=0;i<3;i++){const yy=1120+i*90+Math.sin(t*30+i)*4;ctx.beginPath();ctx.moveTo(938,yy);ctx.lineTo(968,yy-14);ctx.stroke();ctx.beginPath();ctx.moveTo(632,yy);ctx.lineTo(602,yy-14);ctx.stroke();}
    ctx.restore();}
}
function bathroom(t,now2){
  room();tiles();
  // ayna + lavabo (sol duvar)
  ctx.fillStyle='#1d3254';rr(70,1160,190,40,10);ctx.fill();ctx.fillRect(150,1200,30,200);
  ctx.strokeStyle=C.line;ctx.lineWidth=5;rr(85,860,160,230,70);ctx.stroke();
  ctx.save();rr(90,865,150,220,66);ctx.clip();ctx.fillStyle=hexA(C.teal,0.07);ctx.fillRect(80,860,170,240);ctx.restore();
  // havlu askısı
  ctx.fillStyle='#2c4772';ctx.fillRect(950,800,110,8);ctx.fillStyle=hexA(C.amber,0.55);rr(968,806,76,120,8);ctx.fill();
  const shake=now2?0:(t<T_STOP?(t<1.0?sm(0,0.4,t):1)*(0.8+0.3*Math.sin(t*3)):0);
  const err=now2||t>=T_STOP;
  washer(t,shake,err);
  if(!now2){tag(L('BANYO','BATHROOM'),540,1470,C.teal,sm(0.4,1.0,t)*(1-sm(5.6,6.2,t)));
    tag(L('HATA','ERROR'),785,990,RED,sm(T_STOP+0.2,T_STOP+0.6,t)*(1-sm(10.0,10.4,t)));}

  // ---- SEN
  let o, x=400, f=1, phoneOn=false, phoneLit=false, buzz=0;
  if(now2){
    const sad=sm(49.6,50.6,t);
    o=blend({...POSE.stand,ua:30,fa:120,ua2:10,fa2:20},{...POSE.sad,ua:12,fa:40},sad);
    o.eyes=sad>0.5?'tired':'open';phoneOn=true;
  } else if(t<T_STOP){
    o={...POSE.stand,ua:22+Math.sin(t*2)*4,fa:70,ua2:20,fa2:72,eyes:t>2?'wide':'open',look:2};
  } else if(t<10.3){
    const k=sm(T_STOP,T_STOP+0.4,t), g=sm(T_GRUMBLE-0.8,T_GRUMBLE,t);
    const w=Math.sin(t*7);
    o=blend({...POSE.stand,ua:22,fa:70,ua2:20,fa2:72},{lean:0,th:0,sh:0,th2:0,sh2:0,ua:60+w*25*g,fa:125+w*30*g,ua2:55-w*20*g,fa2:120-w*25*g},k);
    o.eyes='wide';o.nod=Math.sin(t*9)*3*g;
  } else if(t<16.3){
    const k=sm(10.3,10.8,t);const typing=t>11.0&&t<12.9;const j=typing?Math.sin(t*28)*6:0;
    o=blend({lean:0,th:0,sh:0,th2:0,sh2:0,ua:60,fa:125,ua2:55,fa2:120},{lean:6,th:0,sh:0,th2:0,sh2:0,ua:42,fa:150+j,ua2:36,fa2:148-j,look:6},k);
    o.eyes=t>T_IKI?'wide':'open';phoneOn=k>0.6;phoneLit=t>T_REPLY;buzz=t>T_REPLY&&t<T_REPLY+0.9?1:0;
    if(t>T_IKI){o.nod=-3;}
  } else if(t<20.3){
    const u=t-16.3, ph=Math.sin(u*1.35), vel=Math.cos(u*1.35);
    x=400+150*ph; f=vel>=0?1:-1; const p=u*8.5;
    o={...walk(p),ua:70+Math.sin(t*8)*25,fa:120+Math.sin(t*8)*25};
    o.y=STAND_Y-walkBob(p);o.eyes='wide';
  } else {
    const u=16.3+4.0;const xx=400+150*Math.sin(4.0*1.35);x=lerp(xx,400,sm(20.3,20.9,t));
    o={...POSE.stand,ua:10,fa:18,eyes:'open',nodY:sm(20.6,21.2,t)*4,look:sm(20.6,21.2,t)*4};
  }
  const fig=figure({x,y:o.y??STAND_Y,color:C.coral,facing:f,...o});
  if(phoneOn) phone(fig.hand[0]+6*f,fig.hand[1]-14,{lit:phoneLit,buzz,t});
  tag('SEN',fig.head[0],fig.head[1]-92,C.coral,1);
  // stres + söylenme balonu
  if(!now2){
    const sa=sm(T_GRUMBLE-0.6,T_GRUMBLE,t)*(1-sm(10.2,10.6,t))+sm(16.3,16.7,t)*(1-sm(20.2,20.6,t))+sm(T_IKI,T_IKI+0.3,t)*(1-sm(16.0,16.3,t));
    stress(fig.head,t,clamp(sa),1);
    const ba=sm(T_GRUMBLE,T_GRUMBLE+0.25,t)*(1-sm(10.0,10.3,t))+sm(16.8,17.0,t)*(1-sm(20.0,20.3,t));
    if(ba>0){const bx=clamp(fig.head[0]+40,260,560);bubble(bx,fig.head[1]-205,'#@%!',clamp(ba),RED);}
  }
  return fig;
}

// ---------- ESKİ EV (geçmiş) ----------
function snowWindow(t,x,y,w,h){ctx.save();rr(x,y,w,h,8);ctx.fillStyle='#1a2c4e';ctx.fill();ctx.clip();
  const heavy=0.6+0.4*sm(29.2,30.0,t);
  for(let i=0;i<46*heavy;i++){const sx=x+((i*73)%w)+Math.sin(t*1.3+i)*8;const sy=y+(((i*131)+t*(40+(i%5)*12))%h);
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(sx,sy,2.5+(i%3),0,7);ctx.fill();}
  ctx.fillStyle='#e9eef7';ctx.fillRect(x,y+h-16,w,16);
  ctx.restore();ctx.strokeStyle='#3a4f70';ctx.lineWidth=7;rr(x,y,w,h,8);ctx.stroke();
  ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke();}
const CLOTHES=[['#c98a5a',70],['#8fa3c4',60],['#e0c9a6',80],['#b06d5a',55],['#9bb58a',70],['#d8b27a',60],['#8a7aa8',75],['#c2a07a',55],['#7fa0b0',65],['#e8d8bd',60],['#a8745a',70],['#c9b28f',58],['#8fb0a0',64],['#d09a7a',56]];
function clothesline(t){const y=900;ctx.strokeStyle='#5a6f90';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(60,y-20);ctx.quadraticCurveTo(540,y+30,1020,y-20);ctx.stroke();
  const base=3, extra=Math.floor(clamp((t-43.4)/3.0)*11);const n=base+(t>43.4?extra:0);
  let cx=100;for(let i=0;i<n&&i<CLOTHES.length;i++){const [c,w]=CLOTHES[i];const u=(cx+w/2-60)/960;const yy=y-20+Math.sin(u*Math.PI)*42-0;
    const sw=Math.sin(t*1.5+i)*2;ctx.save();ctx.translate(cx+w/2,yy);ctx.rotate(rad(sw));
    const pop=i>=base?sm(43.4+(i-base)*3.0/11,43.4+(i-base)*3.0/11+0.25,t):1;ctx.globalAlpha=pop;
    ctx.fillStyle=c;rr(-w/2,0,w,70+(i%3)*14,6);ctx.fill();ctx.fillStyle='#5a4a3a';ctx.fillRect(-w/2+6,-6,6,14);ctx.fillRect(w/2-12,-6,6,14);ctx.restore();cx+=w+8;}}
function basin(t,cx=620){const top=1338;
  ctx.fillStyle='#6f7a88';ctx.beginPath();ctx.moveTo(cx-125,top);ctx.lineTo(cx+125,top);ctx.lineTo(cx+98,1400);ctx.lineTo(cx-98,1400);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8c97a5';ctx.beginPath();ctx.ellipse(cx,top,128,24,0,0,7);ctx.fill();
  ctx.fillStyle='#b9d3e0';ctx.beginPath();ctx.ellipse(cx,top+2,112,17,0,0,7);ctx.fill();
  // köpük / çamaşır
  [[-60,'#efe4cf'],[-10,'#c98a5a'],[45,'#8fa3c4']].forEach(([o,c],i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(cx+o+Math.sin(t*3+i)*3,top,26,9,0,0,7);ctx.fill();});
  ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(cx-80+i*30+Math.sin(t*2+i)*4,top-4-Math.abs(Math.sin(t*3+i))*5,5+(i%2)*3,0,7);ctx.fill();}}
function drops(t,x,y,a){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#d4ecf5';
  for(let i=0;i<5;i++){const ph=((t*2.2)+i*0.21)%1;const dx=(i-2)*16+Math.sin(i*7)*6;ctx.beginPath();ctx.arc(x+dx+ph*(i-2)*14,y-Math.sin(ph*Math.PI)*46,4,0,7);ctx.fill();}ctx.restore();}
function past(t){
  room();
  // sıcak duvar kağıdı deseni
  ctx.save();ctx.globalAlpha=0.18;ctx.fillStyle=C.cream;for(let y=520;y<1380;y+=80)for(let x=(y/80%2)*40;x<W;x+=80){ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();}ctx.restore();
  snowWindow(t,770,470,220,250);
  // küçük çerçeve
  ctx.strokeStyle='#4a5f80';ctx.lineWidth=5;rr(130,560,140,170,8);ctx.stroke();ctx.fillStyle=hexA(C.cream,0.25);ctx.beginPath();ctx.arc(200,630,26,0,7);ctx.fill();ctx.fillRect(170,660,60,50);
  clothesline(t);
  // halı
  ctx.fillStyle='#3b2c3a';ctx.beginPath();ctx.ellipse(560,1420,430,40,0,0,7);ctx.fill();
  basin(t);

  // ---- ANNEN (çömelmiş, ovuyor)
  const blow=sm(T_BLOW-0.3,T_BLOW+0.1,t)*(1-sm(37.6,38.1,t));
  const wring=sm(32.5,32.8,t)*(1-sm(34.2,34.6,t));
  const rest=sm(T_REST,T_REST+0.3,t)*(1-sm(T_REST+1.3,T_REST+1.6,t));   // "Duymadın" — doğrulur, çocuğa bakar
  const sc=Math.sin(t*9);
  let o={lean:28+sc*3,th:100,sh:-10,th2:96,sh2:-14,ua:55+sc*10,fa:30+Math.sin(t*9+0.6)*14,ua2:58-sc*9,fa2:36-Math.sin(t*9+0.6)*12,eyes:'open',look:6,nod:2};
  o=blend(o,{lean:18,ua:78+Math.sin(t*6)*4,fa:100,ua2:72-Math.sin(t*6)*4,fa2:92,look:2},wring);
  o=blend(o,{lean:10,ua:55+Math.sin(t*10)*3,fa:172,ua2:48-Math.sin(t*10)*3,fa2:166,look:0,eyes:'tired'},blow);
  o=blend(o,{lean:14,look:-2},rest);
  if(blow>0.5)o.eyes='tired';
  const mom=figure({x:400,y:FLOOR-56,color:C.cream,...o});
  // sıkılan çamaşır
  if(wring>0.05){ctx.save();ctx.globalAlpha=wring;ctx.strokeStyle='#c98a5a';ctx.lineWidth=18;ctx.lineCap='round';
    const mx=(mom.hand[0]+mom.handB[0])/2, my=(mom.hand[1]+mom.handB[1])/2;
    ctx.beginPath();ctx.moveTo(mx-24,my-6);for(let i=0;i<=6;i++){ctx.lineTo(mx-24+i*8+Math.sin(i*1.8+t*6)*5,my+i*12);}ctx.stroke();
    ctx.fillStyle='#d4ecf5';for(let i=0;i<4;i++){const ph=((t*1.8)+i*0.25)%1;ctx.beginPath();ctx.arc(mx-4+i*4,my+80+ph*(1338-my-80),5,0,7);ctx.fill();}ctx.restore();}
  if(blow<0.3&&wring<0.3) drops(t,(mom.hand[0]+mom.handB[0])/2,1330,1-Math.max(blow,wring)*3);
  // nefes
  if(blow>0.2){ctx.save();for(let i=0;i<4;i++){const ph=((t*1.6)+i*0.25)%1;ctx.globalAlpha=blow*(1-ph)*0.7;ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(mom.head[0]+46+ph*40,mom.head[1]+22+ph*14,6+ph*16,0,7);ctx.fill();}ctx.restore();}
  // kıpkırmızı eller
  const red=sm(T_RED-0.2,T_RED+0.3,t)*(1-sm(46.5,47.2,t)*0.5);
  if(red>0){ctx.save();ctx.globalAlpha=red;ctx.fillStyle='#ff3b2f';glow('#ff3b2f',30+Math.sin(t*6)*8);
    [mom.hand,mom.handB].forEach(h=>{ctx.beginPath();ctx.arc(h[0],h[1],15,0,7);ctx.fill();});ctx.restore();}
  tag('ANNEN',mom.head[0],mom.head[1]-82,C.cream,sm(24.0,24.6,t));

  // ---- küçük SEN (top oynuyor)
  const ks=0.55, kx=850+Math.sin(t*0.7)*20;
  const bounce=Math.abs(Math.sin(t*3.2));
  const look=rest>0.3;
  const kid=figure({x:kx,y:standY(ks)-bounce*3,s:ks,color:C.coral,facing:-1,lean:6,th:0,sh:0,th2:0,sh2:0,
    ua:40+bounce*35,fa:60+bounce*30,ua2:10,fa2:18,eyes:look?'wide':'open',look:look?-4:4});
  const bx=kx-58, by=1395-14-(1-bounce)*0+ -bounce*90;
  ctx.save();ctx.fillStyle=C.amber;glow(C.amber,14);ctx.beginPath();ctx.arc(bx,1381-bounce*95,14,0,7);ctx.fill();ctx.restore();
  tag('SEN',kid.head[0],kid.head[1]-64,C.coral,sm(25.0,25.6,t));

  // etiketler
  tag(L('YILLAR ÖNCE','YEARS AGO'),540,1475,C.amber,sm(22.6,23.2,t)*(1-sm(28.5,29.0,t)));
  tag(L('KIŞ','WINTER'),880,440,'#e9eef7',sm(29.3,29.8,t)*(1-sm(34.6,35.0,t)));
  tag(L('SU BUZ GİBİ','ICE-COLD WATER'),620,1475,C.teal,sm(30.5,30.9,t)*(1-sm(34.6,35.0,t)));
  // 20 YIL
  const ya=sm(T_YIL,T_YIL+0.3,t)*(1-sm(46.8,47.2,t));
  if(ya>0){const pop=1+0.25*(1-sm(T_YIL,T_YIL+0.4,t));bigText(L('20 YIL','20 YEARS'),540,610,L(130,108)*pop,C.amber,ya,900);
    tag(L('HER HAFTA','EVERY WEEK'),540,715,C.cream,sm(44.6,45.0,t)*(1-sm(46.8,47.2,t)));}
}
// sepya / sıcak ton
function warmTone(a){if(a<=0)return;ctx.save();
  ctx.globalAlpha=0.62*a;ctx.globalCompositeOperation='color';ctx.fillStyle='#b07a42';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.30*a;ctx.globalCompositeOperation='soft-light';ctx.fillStyle='#ffcf8a';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=0.10*a;ctx.fillStyle='#ffb070';ctx.fillRect(0,0,W,H);
  ctx.restore();}

// ---------- ALTYAZILAR ----------
const Wt='#fff', A=C.amber, Co=C.coral, Te=C.teal;
function caps(t){ if(LANG==='en') return capsEN(t);
  caption([[['Çamaşır makinen ',Wt],['bozuldu',A]],[['diye ',Wt],['sinirlendin ',Co],['mi?',Wt]]],0.2,2.85,t,68);
  caption([[['Hadi, ',Wt],['doğru söyle.',A]]],2.85,4.45,t,74);
  caption([[['Makine titredi, titredi...',Wt]],[['durdu.',RED]]],4.6,7.4,t);
