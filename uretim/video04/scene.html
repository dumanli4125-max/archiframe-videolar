<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../kit/engine.js"></script>
<script>
// 04 — Annenin aramaları. Üst panel: SEN'in dünyası, alt panel: annenin evi.
// VO başlangıçları (audio.py ile aynı): l01 0.3, l02 3.6, l03 8.6, l04 12.1, l05 18.0, l06 24.4, l07 29.4, l08 33.4, l09 37.5, l10 44.6, l11 51.0
const DURATION = 57.5;
// EN: sayaç vuruşları İngilizce sayı kelimelerine oturur (one/two/five/twelve)
const HITS = L([25.7,26.6,27.4,28.3],[25.6,26.4,27.2,27.85]);
const PT = 400, PB = 1080, PH = 640, FY = 540, S = 0.75;   // panel üstleri, yükseklik, panel içi zemin, karakter ölçeği
const SIT_Y = FY-55, STAND_YP = FY-142*S, TOP = FY-100;    // oturan/ayakta kalça, masa üstü
let SENPH = null, MOMPH = null;                             // telefonların global konumları (hat için)

// ---------- küçük çizim parçaları (panel içi yerel koordinat) ----------
function panelBg(top, bot, floorCol){
  const g=ctx.createLinearGradient(0,0,0,PH);g.addColorStop(0,top);g.addColorStop(1,bot);ctx.fillStyle=g;ctx.fillRect(0,0,W,PH);
  ctx.fillStyle=floorCol||C.floor;ctx.fillRect(0,FY,W,PH-FY);
  ctx.strokeStyle=hexA(C.line,0.6);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,FY);ctx.lineTo(W,FY);ctx.stroke();
  ctx.strokeStyle=hexA(C.line,0.2);ctx.lineWidth=1.5;for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(W/2+i*80,FY);ctx.lineTo(W/2+i*200,PH);ctx.stroke();}
}
function tableP(x0,x1,top=TOP,col='#1d3254'){ctx.fillStyle=col;ctx.fillRect(x0,top,x1-x0,12);ctx.fillRect(x0+18,top+12,10,FY-top-12);ctx.fillRect(x1-28,top+12,10,FY-top-12);}
function chairP(x,f=1){ctx.fillStyle='#22385c';ctx.fillRect(x-38,FY-62,76,10);ctx.fillRect(x-4,FY-52,8,52);const bx=x-f*40;rr(bx-8,FY-170,16,118,8);ctx.fill();}
function sofaP(x0,w){ctx.fillStyle='#24406b';rr(x0+16,FY-150,w-32,50,22);ctx.fill();rr(x0,FY-100,w,64,18);ctx.fill();
  ctx.fillStyle='#1b3156';rr(x0-12,FY-118,40,100,16);ctx.fill();rr(x0+w-28,FY-118,40,100,16);ctx.fill();ctx.fillStyle='#16294a';ctx.fillRect(x0+12,FY-36,12,36);ctx.fillRect(x0+w-24,FY-36,12,36);}
function steam(x,y,a,t,sc=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='rgba(239,228,207,.55)';ctx.lineWidth=3;ctx.lineCap='round';
  for(let i=-1;i<=1;i++){ctx.beginPath();for(let k=0;k<=12;k++){const yy=y-k*4*sc, xx=x+i*9*sc+Math.sin(k*0.7+t*3+i)*4*sc;k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}ctx.stroke();}ctx.restore();}
function teaGlass(x,y,st,t){ctx.fillStyle='#b9b2a0';ctx.beginPath();ctx.ellipse(x,y-3,22,5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-9,y-6);ctx.quadraticCurveTo(x-17,y-22,x-10,y-38);ctx.lineTo(x+10,y-38);ctx.quadraticCurveTo(x+17,y-22,x+9,y-6);ctx.closePath();
  ctx.save();glow(C.amber,14);ctx.fillStyle=hexA('#c0581e',0.92);ctx.fill();ctx.restore();ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2;ctx.stroke();
  steam(x,y-44,st,t,0.8);}
function pot(x,y,st,t){ctx.fillStyle='#3d587f';rr(x-42,y-46,84,46,10);ctx.fill();ctx.fillStyle='#4f6c96';ctx.beginPath();ctx.ellipse(x,y-46,46,9,0,0,7);ctx.fill();
  ctx.fillRect(x-5,y-60,10,10);ctx.fillStyle='#2c4772';ctx.fillRect(x-58,y-36,16,8);ctx.fillRect(x+42,y-36,16,8);steam(x,y-66,st,t,1.3);}
function teapot(x,y,t){ctx.fillStyle='#3d587f';rr(x-44,y-60,88,60,16);ctx.fill();rr(x-26,y-100,52,40,12);ctx.fill();ctx.fillStyle='#4f6c96';ctx.fillRect(x-6,y-110,12,10);
  ctx.strokeStyle='#3d587f';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+40,y-34);ctx.lineTo(x+66,y-62);ctx.stroke();steam(x+68,y-70,0.6,t,0.8);}
function skyWindow(x,y,w,h,day){ctx.save();rr(x,y,w,h,8);const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,`rgb(${lerp(19,92,day)},${lerp(42,140,day)},${lerp(82,190,day)})`);g.addColorStop(1,`rgb(${lerp(14,180,day)},${lerp(30,170,day)},${lerp(60,150,day)})`);ctx.fillStyle=g;ctx.fill();ctx.clip();
  if(day>0.5){ctx.globalAlpha=(day-0.5)*2;ctx.fillStyle='#ffe3a0';glow('#ffe3a0',40);ctx.beginPath();ctx.arc(x+w*0.7,y+h*0.32,24,0,7);ctx.fill();noGlow();}
  else{ctx.globalAlpha=1-day*2;ctx.fillStyle='#e9e2cf';glow('#e9e2cf',30);ctx.beginPath();ctx.arc(x+w*0.68,y+h*0.3,22,0,7);ctx.fill();noGlow();
    ctx.fillStyle=`rgb(19,42,82)`;ctx.beginPath();ctx.arc(x+w*0.68+10,y+h*0.3-7,19,0,7);ctx.fill();
    for(let i=0;i<8;i++){ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(x+8+((i*67)%(w-16)),y+8+((i*41)%(h*0.6)),3,3);}}
  ctx.restore();ctx.strokeStyle=C.line;ctx.lineWidth=5;rr(x,y,w,h,8);ctx.stroke();ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.lineWidth=3;ctx.stroke();}
// masadaki / eldeki küçük telefon
function miniPhone(x,y,{lit=false,col=null,ring=0,rot=-0.3,flat=false,t=0}={}){
  const c=col||(lit?C.amber:C.teal);const jx=ring>0?Math.sin(t*80)*3*ring:0;
  ctx.save();ctx.translate(x+jx,y);ctx.rotate(flat?0:rot);
  if(flat){rr(-26,-7,52,10,4);ctx.fillStyle='#0a1222';ctx.fill();glow(c,lit?30:8);rr(-22,-8,44,4,2);ctx.fillStyle=hexA(c,lit?0.95:0.4);ctx.fill();}
  else{rr(-14,-26,28,52,6);ctx.fillStyle='#0a1222';ctx.fill();glow(c,lit?30:10);rr(-10,-21,20,42,4);ctx.fillStyle=hexA(c,lit?0.85:0.45);ctx.fill();}
  ctx.restore();noGlow();
  if(lit){const g=ctx.createRadialGradient(x,y,4,x,y,110);g.addColorStop(0,hexA(c,0.25));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-110,y-110,220,220);}
  if(ring>0){for(let i=0;i<3;i++){const r_=((t*90)+i*24)%72;ctx.strokeStyle=hexA(c,(1-r_/72)*ring);ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y,22+r_,-1.2,-0.2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,22+r_,Math.PI+0.2,Math.PI+1.2);ctx.stroke();}}
}
// arama kartı
function callCard(x,y,sc,a,state,t,buzz=0){if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;ctx.translate(x+(buzz?Math.sin(t*85)*5*buzz:0),y);ctx.scale(sc,sc);
  rr(-330,-80,660,160,40);ctx.fillStyle='rgba(16,30,54,0.97)';glow('rgba(0,0,0,.6)',30);ctx.fill();noGlow();
  ctx.lineWidth=3;ctx.strokeStyle=hexA(state==='rejected'?C.coral:C.amber,0.6);ctx.stroke();
  ctx.fillStyle=C.cream;ctx.beginPath();ctx.arc(-250,0,50,0,7);ctx.fill();
  ctx.fillStyle=C.ink;ctx.font='800 50px Inter';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(L('A','M'),-250,3);
  ctx.textAlign='left';ctx.fillStyle=C.amber;ctx.font='800 46px Inter';ctx.letterSpacing='4px';ctx.fillText(L('ANNEM','MOM'),-172,-20);ctx.letterSpacing='0px';
  ctx.font='500 30px Inter';ctx.fillStyle=state==='rejected'?C.coral:'rgba(233,238,247,.8)';ctx.fillText(state==='rejected'?L('reddedildi','declined'):L('arıyor...','calling...'),-172,30);
  const pul=state==='ring'?1+0.08*Math.sin(t*12):1;
  ctx.save();ctx.translate(165,0);if(state==='rejected'){glow(C.coral,30);ctx.scale(1.12,1.12);}ctx.fillStyle='#e0483a';ctx.beginPath();ctx.arc(0,0,44,0,7);ctx.fill();noGlow();
  ctx.rotate(2.3);ctx.fillStyle='#fff';rr(-22,-7,44,14,7);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(272,0);ctx.scale(pul,pul);ctx.globalAlpha=a*(state==='rejected'?0.3:1);ctx.fillStyle='#2fbf71';ctx.beginPath();ctx.arc(0,0,44,0,7);ctx.fill();
  ctx.rotate(-0.8);ctx.fillStyle='#fff';rr(-22,-7,44,14,7);ctx.fill();ctx.restore();
  ctx.restore();}
// mesaj kartı
function msgCard(x,y,sc,a,title,msg,letter=L('A','M')){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y+(1-a)*14);ctx.scale(sc,sc);
  ctx.font='500 32px Inter';const mw=Math.max(ctx.measureText(msg).width,180);const w=mw+190,hx=-w/2;
  rr(hx,-62,w,124,28);ctx.fillStyle='rgba(16,30,54,0.97)';glow('rgba(0,0,0,.6)',30);ctx.fill();noGlow();ctx.lineWidth=2;ctx.strokeStyle=hexA(C.teal,0.55);ctx.stroke();
  ctx.fillStyle=C.cream;ctx.beginPath();ctx.arc(hx+64,0,36,0,7);ctx.fill();ctx.fillStyle=C.ink;ctx.font='800 34px Inter';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(letter,hx+64,2);
  ctx.textAlign='left';ctx.fillStyle=C.amber;ctx.font='800 26px Inter';ctx.letterSpacing='3px';ctx.fillText(title,hx+122,-22);ctx.letterSpacing='0px';
  ctx.fillStyle='#e9eef7';ctx.font='500 32px Inter';ctx.fillText(msg,hx+122,20);ctx.restore();}
// anne: krem, eğik, topuz
function momFig(o){const f=figure({color:C.cream,s:S,...o});const fc=o.facing||1;
  ctx.save();ctx.globalAlpha=o.alpha??1;ctx.fillStyle=shade(C.cream,-0.14);ctx.beginPath();ctx.arc(f.head[0]-24*fc*S,f.head[1]-24*S,15*S,0,7);ctx.fill();ctx.restore();return f;}
function senFig(o){const f=figure({color:C.coral,s:S,...o});tag('SEN',f.head[0],f.head[1]-66,C.coral);return f;}
const SITP={lean:2,th:90,sh:0,th2:86,sh2:-4,ua:20,fa:60,ua2:18,fa2:56};
const STANDP={lean:3,th:0,sh:0,th2:0,sh2:0,ua:8,fa:14,ua2:8,fa2:14};
function sitStand(k,base={}){return blend({...SITP,...base},{...STANDP},k);}

// ================= ÜST PANEL: SEN =================
function topOffice(t){
  panelBg('#132640','#0d1a30');
  // sunum ekranı
  rr(90,110,330,210,10);ctx.fillStyle='#0b1426';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#2c4772';ctx.stroke();
  ctx.save();glow(C.teal,30);rr(102,122,306,186,6);ctx.fillStyle=hexA(C.teal,0.2);ctx.fill();ctx.restore();
  [[140,0.45],[200,0.7],[260,0.55],[320,0.9]].forEach(([bx,h])=>{ctx.fillStyle=hexA(C.teal,0.75);ctx.fillRect(bx,290-150*h*(0.9+0.1*Math.sin(t+bx)),36,150*h*(0.9+0.1*Math.sin(t+bx)));});
  // sunan kişi
  const sw=Math.sin(t*1.6);
  figure({x:500,y:STAND_YP,s:S,facing:-1,color:C.cream,...STANDP,ua:lerp(70,100,0.5+0.5*sw),fa:lerp(80,100,0.5+0.5*sw),lean:2+sw*2});
  // masa başındakiler (masaya doğru, sola bakıyor)
  chairP(720,-1);chairP(930,-1);
  figure({x:720,y:SIT_Y,s:S,facing:-1,color:C.cream,...SITP,ua:30,fa:70,nodY:Math.sin(t*0.9)*2,look:2});
  const buzzOn=t>5.9&&t<8.7, reach=sm(8.2,8.6,t)*(1-sm(9.2,9.8,t));
  const look=sm(6.0,6.4,t)*(1-sm(11.2,11.6,t));
  const s=senFig({x:930,y:SIT_Y,facing:-1,...SITP,lean:lerp(2,10,look),ua:lerp(22,58,reach),fa:lerp(64,78,reach),look:look*5,eyes:buzzOn?'wide':'open'});
  tableP(570,1000);
  const ph=[855,TOP-4];miniPhone(ph[0],ph[1],{flat:true,lit:t>5.9&&t<9.2,col:t>8.7?C.coral:C.amber,ring:buzzOn?1:0,t});
  tag(L('TOPLANTI','MEETING'),170,50,C.teal);
  callCard(640,175,0.72,sm(5.9,6.2,t)*(1-sm(9.3,9.7,t)),t>8.7?'rejected':'ring',t,buzzOn?1:0);
  const b3=L(10.8,11.3);bubble(780,150,L('Sonra ararım.',"I'll call you later."),sm(b3,b3+0.25,t)*(1-sm(11.9,12.0,t)));
}
function topCafe(t){
  panelBg('#0c1830','#081224');
  // ışık zinciri
  ctx.strokeStyle=hexA(C.line,0.8);ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=W;x+=10){const y=70+Math.sin(x/W*Math.PI*2)*-0+40*Math.sin((x%360)/360*Math.PI);x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
  for(let x=20;x<W;x+=60){const y=70+40*Math.sin((x%360)/360*Math.PI);ctx.save();glow(C.amber,20);ctx.fillStyle=hexA(C.amber,0.75+0.25*Math.sin(t*3+x));ctx.beginPath();ctx.arc(x,y+10,7,0,7);ctx.fill();ctx.restore();}
  // arka plan binalar
  ctx.fillStyle='#0e1d38';[[40,180,140],[200,140,120],[760,160,150],[930,120,130]].forEach(([x,y,w])=>ctx.fillRect(x,y+60,w,FY-y-60));
  for(let i=0;i<14;i++){ctx.fillStyle=hexA(C.amber,0.35);ctx.fillRect([60,90,120,220,250,290,780,820,860,950,980,1010,150,880][i],[270,320,380,240,300,360,260,330,400,220,300,380,420,450][i],12,16);}
  const laugh=Math.max(0,Math.sin(t*7))*(t<13.4||t>17.0?1:0.25);
  // arkadaş 1 (sol, oturuyor)
  chairP(330,1);
  figure({x:330,y:SIT_Y,s:S,facing:1,color:C.cream,...SITP,lean:2-laugh*6,ua:40,fa:110-laugh*20,ua2:30,fa2:70});
  // arkadaş 2 (sağda ayakta, bardak)
  const f2=figure({x:860,y:STAND_YP,s:S,facing:-1,color:C.cream,...STANDP,lean:4+laugh*5,ua:40,fa:120+Math.sin(t*2)*10,nodY:laugh*3});
  ctx.fillStyle=hexA(C.amber,0.85);rr(f2.hand[0]-10,f2.hand[1]-30,20,30,4);ctx.fill();
  // SEN (oturuyor, sola bakıyor)
  chairP(680,-1);
  const buzzOn=t>13.2&&t<16.2, look=sm(13.4,13.8,t)*(1-sm(17.0,17.4,t)), reach=sm(15.8,16.15,t)*(1-sm(16.6,17.1,t));
  senFig({x:680,y:SIT_Y,facing:-1,...SITP,lean:lerp(2-laugh*5,10,look),ua:lerp(30,60,reach),fa:lerp(90,80,reach),look:look*5,eyes:buzzOn?'wide':'open'});
  tableP(420,600);
  teaGlass(470,TOP,0,t);ctx.fillStyle=hexA(C.amber,0.8);rr(520,TOP-34,22,34,4);ctx.fill();
  miniPhone(560,TOP-4,{flat:true,lit:t>13.2&&t<16.7,col:t>16.2?C.coral:C.amber,ring:buzzOn?1:0,t});
  tag(L('DIŞARIDA','OUT'),170,50,C.amber);
  callCard(560,175,0.72,sm(13.2,13.5,t)*(1-sm(16.45,16.7,t)),t>16.2?'rejected':'ring',t,buzzOn?1:0);
  const b4=L(16.7,17.15);bubble(700,170,L('Sonra.','Later.'),sm(b4,b4+0.25,t)*(1-sm(17.7,17.95,t)));
}
const DAY=[[3.3,1],[11.8,1],[12.3,0],[24.8,0],[25.2,1],[25.7,1],[26.1,0],[26.6,0],[27.0,1],[27.4,1],[27.9,0],[28.3,0],[28.8,0],[29.4,1],[36.5,1],[37.4,0]];
function topDesk(t){
  const day=keyed(t,DAY);
  panelBg('#132640','#0d1a30');
  skyWindow(120,90,280,250,day);
  // raf + bitki
  ctx.fillStyle='#1d3254';ctx.fillRect(700,170,260,10);ctx.fillStyle='#2f6b62';ctx.beginPath();ctx.ellipse(740,150,16,24,0,0,7);ctx.fill();
  ctx.fillStyle='#24406b';ctx.fillRect(800,128,26,42);ctx.fillRect(834,138,22,32);
  chairP(470,1);
  const typing=!(t>29.9&&t<31.6);
  const look=sm(29.9,30.2,t)*(1-sm(31.4,31.8,t));
  senFig({x:470,y:SIT_Y,facing:1,lean:9-look*4,th:90,sh:0,th2:88,sh2:-2,ua:36,fa:95+(typing?Math.sin(t*26)*4:0),ua2:34,fa2:93+(typing?Math.sin(t*26+1.5)*4:0),look:look*4,eyes:t>33.4?'tired':'open'});
  tableP(560,880);
  // dizüstü
  ctx.fillStyle='#2c4772';ctx.fillRect(600,TOP-6,150,6);ctx.save();ctx.translate(745,TOP-6);ctx.rotate(-1.75);rr(0,-4,100,8,3);ctx.fillStyle='#2c4772';ctx.fill();ctx.restore();
  ctx.save();glow(C.teal,30);ctx.fillStyle=hexA(C.teal,0.25);ctx.beginPath();ctx.moveTo(745,TOP-6);ctx.lineTo(728,TOP-104);ctx.lineTo(735,TOP-104);ctx.lineTo(752,TOP-6);ctx.fill();ctx.restore();
  const hits=[...HITS,29.9];const near=hits.some(h=>t>h&&t<h+0.7);
  miniPhone(820,TOP-4,{flat:true,lit:near,col:C.amber,ring:near&&t<29.9?1:0,t});
  const dn=t<HITS[0]?'':t<HITS[1]?L('ÇARŞAMBA','WEDNESDAY'):t<HITS[2]?L('CUMA','FRIDAY'):t<HITS[3]?L('PAZAR','SUNDAY'):t<29.4?L('2 HAFTA','2 WEEKS'):'';
  tag(L('İŞ','WORK'),170,50,C.teal,dn?0:1);
  if(dn) tag(dn,900,50,C.amber);
  msgCard(540,175,0.82,sm(29.9,30.15,t)*(1-sm(33.0,33.3,t)),L('ANNEM','MOM'),L('Yemek yaptım, gelirsin diye.','I cooked. Thought you might come by.'));
  bubble(600,150,L('Sonra ararım.',"I'll call you later."),sm(33.6,33.85,t)*(1-sm(35.4,35.7,t)));
}
function topHome(t){
  panelBg('#101f38','#0a1528');
  windowNight(700,80,260,250,{moon:true});
  ctx.strokeStyle=C.line;ctx.lineWidth=4;rr(120,120,160,110,6);ctx.stroke();ctx.beginPath();ctx.moveTo(135,215);ctx.lineTo(175,160);ctx.lineTo(205,190);ctx.lineTo(265,140);ctx.stroke();
  // lamba
  ctx.strokeStyle='#2c4772';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(140,FY);ctx.lineTo(140,250);ctx.stroke();
  ctx.save();ctx.fillStyle=C.amber;glow(C.amber,30);ctx.beginPath();ctx.moveTo(110,250);ctx.lineTo(170,250);ctx.lineTo(158,212);ctx.lineTo(122,212);ctx.closePath();ctx.fill();ctx.restore();
  lampCone(140,250,340,290,0.7+0.4*sm(47.3,49,t));
  sofaP(330,380);
  const raise=sm(39.0,39.5,t), hang=sm(44.9,45.5,t)*(1-sm(46.1,46.4,t)), relief=sm(47.4,48.4,t);
  const ear=raise*(1-hang*0.7);
  const tap=t>39.5&&t<46.3?Math.max(0,Math.sin(t*9))*10:0;
  const s=senFig({x:500,y:SIT_Y-14,facing:1,lean:lerp(8,lerp(10,-6,relief),raise),th:90-tap*0.6,sh:0+tap,th2:86,sh2:-4,ua:lerp(30,28,ear),fa:lerp(105,140,ear),ua2:24,fa2:60,
    look:lerp(5,0,ear),eyes:t>46.3&&t<47.4?'wide':'open',nodY:relief*Math.sin(t*3)*2});
  SENPH=[s.hand[0]+6,s.hand[1]-12];
  miniPhone(SENPH[0],SENPH[1],{lit:true,col:relief>0?C.amber:C.teal,t});
  SENPH=[SENPH[0],SENPH[1]+PT];
  tag('EV',170,50,C.teal);
}

// ================= ALT PANEL: ANNENİN EVİ =================
function momHome(t){
  const day=keyed(t,DAY);
  panelBg('#18263f','#101b30','#0d1729');
  // duvar: pencere, saat, çerçeve (SEN'in çocukluk fotoğrafı)
  skyWindow(860,90,170,240,day);
  ctx.strokeStyle=C.line;ctx.lineWidth=4;ctx.beginPath();ctx.arc(330,130,40,0,7);ctx.stroke();
